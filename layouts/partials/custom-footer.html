<!-- Flytende dialogvinduer: drag, resize-persistens, maksimering -->
<script>
(function() {
  var DIALOGS = [
    { overlayId: 'qe-overlay', headerId: 'qe-header', maxBtnId: 'qe-maximize-btn' },
    { overlayId: 'np-overlay', headerId: 'np-header', maxBtnId: 'np-maximize-btn' },
    { overlayId: 'cm-overlay', headerId: 'cm-header', maxBtnId: 'cm-maximize-btn' },
    { overlayId: 'del-overlay', headerId: 'del-header', maxBtnId: null },
    { overlayId: 'pr-overlay', headerId: 'pr-header', maxBtnId: 'pr-maximize-btn' }
  ];

  function saveState(overlay) {
    if (overlay.dataset.maximized === '1') return;
    if (!overlay.offsetWidth || !overlay.offsetHeight) return; // display:none – ikke lagre
    try {
      localStorage.setItem(overlay.id + '-win-v3', JSON.stringify({
        left: overlay.offsetLeft,
        top: overlay.offsetTop,
        width: overlay.offsetWidth,
        height: overlay.offsetHeight
      }));
    } catch(e) {}
  }

  function applyState(overlay) {
    try {
      var s = JSON.parse(localStorage.getItem(overlay.id + '-win-v3'));
      if (s && s.left != null) {
        overlay.style.left   = Math.max(0, s.left)   + 'px';
        overlay.style.top    = Math.max(0, s.top)    + 'px';
        overlay.style.width  = Math.max(420, s.width) + 'px';
        overlay.style.height = Math.max(280, s.height) + 'px';
      }
    } catch(e) {}
  }

  function initDrag(overlay, header) {
    if (!header) return;
    var active = false, ox, oy, sl, st;
    header.addEventListener('mousedown', function(e) {
      if (e.target.tagName === 'BUTTON' || e.target.closest('button')) return;
      if (overlay.dataset.maximized === '1') return;
      active = true;
      ox = e.clientX; oy = e.clientY;
      sl = overlay.offsetLeft; st = overlay.offsetTop;
      e.preventDefault();
    });
    document.addEventListener('mousemove', function(e) {
      if (!active) return;
      overlay.style.left = Math.max(0, sl + e.clientX - ox) + 'px';
      overlay.style.top  = Math.max(0, st + e.clientY - oy) + 'px';
    });
    document.addEventListener('mouseup', function() {
      if (active) { active = false; saveState(overlay); }
    });
  }

  function initMaximize(overlay, btn) {
    if (!btn) return;
    var prev = null;
    btn.addEventListener('click', function() {
      if (overlay.dataset.maximized === '1') {
        if (prev) {
          overlay.style.left = prev.left; overlay.style.top = prev.top;
          overlay.style.width = prev.width; overlay.style.height = prev.height;
          overlay.style.borderRadius = '6px';
        }
        overlay.dataset.maximized = '0';
        btn.innerHTML = '<i class="fa fa-expand"></i>';
      } else {
        prev = { left: overlay.style.left, top: overlay.style.top,
                 width: overlay.style.width, height: overlay.style.height };
        overlay.style.left = '0'; overlay.style.top = '0';
        overlay.style.width = '100vw'; overlay.style.height = '100vh';
        overlay.style.borderRadius = '0';
        overlay.dataset.maximized = '1';
        btn.innerHTML = '<i class="fa fa-compress"></i>';
      }
    });
  }

  function initResize(overlay) {
    var minW = 420, minH = 280;
    var HANDLES = [
      { dir:'n',  css:'top:0;left:6px;right:6px;height:5px;cursor:n-resize;' },
      { dir:'s',  css:'bottom:0;left:6px;right:6px;height:5px;cursor:s-resize;' },
      { dir:'w',  css:'top:6px;left:0;bottom:6px;width:5px;cursor:w-resize;' },
      { dir:'e',  css:'top:6px;right:0;bottom:6px;width:5px;cursor:e-resize;' },
      { dir:'nw', css:'top:0;left:0;width:8px;height:8px;cursor:nw-resize;' },
      { dir:'ne', css:'top:0;right:0;width:8px;height:8px;cursor:ne-resize;' },
      { dir:'sw', css:'bottom:0;left:0;width:8px;height:8px;cursor:sw-resize;' },
      { dir:'se', css:'bottom:0;right:0;width:8px;height:8px;cursor:se-resize;' }
    ];
    HANDLES.forEach(function(h) {
      var el = document.createElement('div');
      el.style.cssText = 'position:absolute;z-index:10000;' + h.css;
      overlay.appendChild(el);
      el.addEventListener('mousedown', function(e) {
        if (overlay.dataset.maximized === '1') return;
        e.preventDefault(); e.stopPropagation();
        var sx = e.clientX, sy = e.clientY;
        var sl = overlay.offsetLeft, st = overlay.offsetTop;
        var sw = overlay.offsetWidth, sh = overlay.offsetHeight;
        var dir = h.dir;
        function onMove(ev) {
          var dx = ev.clientX - sx, dy = ev.clientY - sy;
          var nL = sl, nT = st, nW = sw, nH = sh;
          if (dir.indexOf('e') !== -1) nW = Math.max(minW, sw + dx);
          if (dir.indexOf('s') !== -1) nH = Math.max(minH, sh + dy);
          if (dir.indexOf('w') !== -1) { nW = Math.max(minW, sw - dx); nL = sl + sw - nW; }
          if (dir.indexOf('n') !== -1) { nH = Math.max(minH, sh - dy); nT = st + sh - nH; }
          overlay.style.left = nL + 'px'; overlay.style.top = nT + 'px';
          overlay.style.width = nW + 'px'; overlay.style.height = nH + 'px';
        }
        function onUp() {
          document.removeEventListener('mousemove', onMove);
          document.removeEventListener('mouseup', onUp);
          saveState(overlay);
        }
        document.addEventListener('mousemove', onMove);
        document.addEventListener('mouseup', onUp);
      });
    });
  }

  DIALOGS.forEach(function(d) {
    var overlay = document.getElementById(d.overlayId);
    if (!overlay) return;
    var header = document.getElementById(d.headerId);
    var maxBtn = document.getElementById(d.maxBtnId);
    initDrag(overlay, header);
    initMaximize(overlay, maxBtn);
    initResize(overlay);
  });

  // Kalles av openEditDialog / openNewSiblingDialog / openNewChildDialog etter display = 'flex'
  window._applyDialogPos = function(overlayId) {
    var overlay = document.getElementById(overlayId);
    if (overlay) applyState(overlay);
  };
})();

// Jobbhistorikk-dialog
(function() {
  var indicator  = document.getElementById('qe-job-indicator');
  var dialog     = document.getElementById('job-history-dialog');
  var listEl     = document.getElementById('job-history-list');
  var closeBtn   = document.getElementById('job-history-close');
  var tabMineBtn = document.getElementById('job-history-tab-mine');
  var tabAllBtn  = document.getElementById('job-history-tab-all');
  if (!indicator || !dialog || !listEl || !closeBtn) return;

  var isEn = document.documentElement.lang === 'en';
  var _historyMode = 'mine';
  var _historyRuns = null;
  var _historyLiveTimer = null;
  var _historyFetchTimer = null;
  var _userNameCache = {}; // login -> display name string or null

  function fmtSec(totalSec) {
    if (totalSec < 60) return totalSec + 's';
    var m = Math.floor(totalSec / 60), s = totalSec % 60;
    return s ? m + 'm' + s + 's' : m + 'm';
  }

  function timeAgo(dateStr) {
    var secs = Math.round((Date.now() - new Date(dateStr).getTime()) / 1000);
    if (secs < 5)    return isEn ? 'just now'      : 'akkurat nå';
    if (secs < 60)   return secs + (isEn ? ' s ago'   : ' sek siden');
    if (secs < 3600) return Math.floor(secs / 60)   + (isEn ? ' min ago'  : ' min siden');
    if (secs < 86400)return Math.floor(secs / 3600)  + (isEn ? ' h ago'   : ' t siden');
    return Math.floor(secs / 86400) + (isEn ? ' d ago' : ' d siden');
  }

  function statusIcon(run) {
    if (run.status === 'in_progress')
      return '<i class="fa fa-spinner fa-spin" style="color:#7ec8e3;"></i>';
    if (run.status === 'queued' || run.status === 'waiting' || run.status === 'pending' || run.status === 'requested')
      return '<i class="fa fa-clock-o" style="color:#aaa;"></i>';
    if (run.conclusion === 'success')
      return '<i class="fa fa-check-circle" style="color:#6dbf85;"></i>';
    if (run.conclusion === 'cancelled')
      return '<i class="fa fa-check-circle" style="color:#888;" title="Avløst av nyere bygg"></i>';
    return '<i class="fa fa-exclamation-circle" style="color:#e07070;"></i>';
  }

  function actorLabel(login) {
    if (login in _userNameCache && _userNameCache[login])
      return login + ' (' + _userNameCache[login] + ')';
    return login;
  }

  function fetchUserName(login) {
    if (login in _userNameCache) return; // already fetching or fetched
    _userNameCache[login] = null; // mark as in-flight
    var token = getStoredToken();
    var headers = { 'Accept': 'application/vnd.github+json' };
    if (token) headers['Authorization'] = 'token ' + token;
    fetch('https://api.github.com/users/' + encodeURIComponent(login), { headers: headers, cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        _userNameCache[login] = data.name || null;
        if (_historyRuns) renderHistory(_historyRuns);
      })
      .catch(function() { _userNameCache[login] = null; });
  }

  function setTab(mode) {
    _historyMode = mode;
    if (tabMineBtn && tabAllBtn) {
      if (mode === 'mine') {
        tabMineBtn.style.color = '#e8e8e8'; tabMineBtn.style.borderBottomColor = '#7ec8e3';
        tabAllBtn.style.color  = '#777';    tabAllBtn.style.borderBottomColor  = 'transparent';
      } else {
        tabAllBtn.style.color  = '#e8e8e8'; tabAllBtn.style.borderBottomColor  = '#7ec8e3';
        tabMineBtn.style.color = '#777';    tabMineBtn.style.borderBottomColor = 'transparent';
      }
    }
  }

  function formatTimestamp(dateStr) {
    var d = new Date(dateStr);
    var pad = function(n) { return n < 10 ? '0' + n : '' + n; };
    var yy = pad(d.getFullYear() % 100);
    var date = yy + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate());
    var time = pad(d.getHours()) + ':' + pad(d.getMinutes()) + ':' + pad(d.getSeconds());
    return '<span style="display:block;">' + date + '</span><span style="display:block;">' + time + '</span>';
  }

  function renderHistory(runs) {
    if (!runs.length) {
      listEl.innerHTML = '<div style="padding:10px 14px; opacity:.6;">' + (isEn ? 'No jobs found.' : 'Ingen jobber funnet.') + '</div>';
      return;
    }
    var showActor = (_historyMode === 'all');
    var html = '';
    runs.forEach(function(run) {
      var login = run.triggering_actor && run.triggering_actor.login;
      if (showActor && login) fetchUserName(login);
      var msg = run.display_title || run.name || '\u2013';
      var maxLen = showActor ? 52 : 58;
      if (msg.length > maxLen) msg = msg.slice(0, maxLen - 1) + '\u2026';
      var time;
      if (run.status === 'queued' || run.status === 'waiting' || run.status === 'pending' || run.status === 'requested' || run.status === 'in_progress') {
        time = fmtSec(Math.round((Date.now() - new Date(run.created_at).getTime()) / 1000));
      } else if (run.conclusion === 'cancelled') {
        time = isEn ? 'Superseded' : 'Avl\u00f8st';
      } else if (run.conclusion === 'success') {
        var durationMs = new Date(run.updated_at).getTime() - new Date(run.created_at).getTime();
        time = fmtSec(Math.round(durationMs / 1000));
      } else {
        time = timeAgo(run.updated_at);
      }
      html += '<div style="display:flex; align-items:flex-start; gap:7px; padding:6px 12px; border-bottom:1px solid rgba(255,255,255,.06);">';
      html += '<span style="flex-shrink:0; width:14px; text-align:center; margin-top:2px;">' + statusIcon(run) + '</span>';
      html += '<span style="flex-shrink:0; font-size:10px; opacity:.45; white-space:nowrap; font-family:monospace; line-height:1.35; text-align:right; margin-top:1px;">' + formatTimestamp(run.created_at) + '</span>';
      html += '<span style="flex:1; min-width:0; overflow:hidden;">';
      html += '<span style="display:block; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + msg + '</span>';
      if (showActor && login) {
        html += '<span style="display:block; font-size:11px; opacity:.45; margin-top:2px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;">' + actorLabel(login) + '</span>';
      }
      html += '</span>';
      html += '<span style="opacity:.5; font-size:12px; flex-shrink:0; white-space:nowrap; margin-left:4px; padding-top:2px;">' + time + '</span>';
      html += '<a href="' + run.html_url + '" target="_blank" rel="noopener" title="' + (isEn ? 'Open in GitHub' : '\u00c5pne i GitHub') + '" style="color:#7ec8e3; text-decoration:none; flex-shrink:0; font-size:12px; opacity:.75; margin-left:4px; padding-top:2px;" onclick="event.stopPropagation();">\u2197</a>';
      html += '</div>';
    });
    listEl.innerHTML = html;
  }

  function fetchHistory() {
    if (!_historyRuns) {
      listEl.innerHTML = '<div style="padding:10px 14px; opacity:.6;">' + (isEn ? 'Loading\u2026' : 'Laster\u2026') + '</div>';
    }
    var token = getStoredToken();
    var login = localStorage.getItem('samt-bu-gh-user');
    var url = 'https://api.github.com/repos/SAMT-X/samt-bu-docs/actions/workflows/hugo.yml/runs?per_page=15';
    if (_historyMode === 'mine' && login) url += '&actor=' + encodeURIComponent(login);
    var headers = { 'Accept': 'application/vnd.github+json' };
    if (token) headers['Authorization'] = 'token ' + token;
    fetch(url, { headers: headers, cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        _historyRuns = data.workflow_runs || [];
        renderHistory(_historyRuns);
      })
      .catch(function(err) {
        listEl.innerHTML = '<div style="padding:10px 14px; color:#e07070;">\u26a0 ' + err.message + '</div>';
      });
  }

  function openHistory() {
    if (window.samtbuCloseIssuesPanel) window.samtbuCloseIssuesPanel();
    dialog.style.display = 'block';
    _historyRuns = null;
    fetchHistory();
    // Live elapsed-teller: re-render hvert sekund fra cache, re-fetch hvert 15. sek
    _historyLiveTimer = setInterval(function() { if (_historyRuns) renderHistory(_historyRuns); }, 1000);
    _historyFetchTimer = setInterval(fetchHistory, 15000);
  }

  function closeHistory() {
    dialog.style.display = 'none';
    clearInterval(_historyLiveTimer);
    clearInterval(_historyFetchTimer);
    _historyLiveTimer = null;
    _historyFetchTimer = null;
  }
  window.samtbuCloseHistory = closeHistory;

  if (tabMineBtn) tabMineBtn.addEventListener('click', function() {
    if (_historyMode !== 'mine') { setTab('mine'); _historyRuns = null; fetchHistory(); }
  });
  if (tabAllBtn) tabAllBtn.addEventListener('click', function() {
    if (_historyMode !== 'all') { setTab('all'); _historyRuns = null; fetchHistory(); }
  });

  indicator.addEventListener('click', function(e) {
    // Ikke åpne dialog hvis klikket var på en lenke inne i indikatoren (f.eks. samtbuShowDoneIndicator)
    if (e.target.tagName === 'A' || e.target.closest('a')) return;
    if (dialog.style.display !== 'none') {
      closeHistory();
    } else {
      openHistory();
    }
  });

  closeBtn.addEventListener('click', closeHistory);

  document.addEventListener('click', function(e) {
    if (dialog.style.display === 'none') return;
    if (!dialog.contains(e.target) && !indicator.contains(e.target)) closeHistory();
  });

  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && dialog.style.display !== 'none') closeHistory();
  });
})();

function _mvMsg(text, isError) {

function _mvOpenBuildDialog(startTime, sourcePerm, isEn, oldEtag) {
  var overlay = document.createElement('div');
  overlay.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99999;display:flex;align-items:center;justify-content:center;';
  var dlg = document.createElement('div');
  dlg.style.cssText = 'background:#fff;border-radius:8px;width:min(460px,92vw);color:#222;box-shadow:0 12px 40px rgba(0,0,0,.32);font-size:16px;font-family:inherit;overflow:hidden;';
  var hdr = document.createElement('div');
  hdr.style.cssText = 'display:flex;align-items:center;justify-content:space-between;padding:.85rem 1.3rem;background:#1a4a8a;color:#fff;';
  var ttl = document.createElement('h3');
  ttl.style.cssText = 'margin:0;font-size:17px;font-weight:700;';
  ttl.textContent = isEn ? 'Moving chapter' : 'Flytt kapittel';
  var xBtn = document.createElement('button');
  xBtn.type = 'button';
  xBtn.style.cssText = 'background:none;border:none;cursor:pointer;font-size:20px;color:rgba(255,255,255,.7);line-height:1;padding:0 0 0 .75rem;';
  xBtn.textContent = '✕';
  hdr.appendChild(ttl); hdr.appendChild(xBtn);
  var body = document.createElement('div');
  body.style.cssText = 'padding:1.5rem 1.6rem 1.6rem;';
  var statusEl = document.createElement('p');
  statusEl.style.cssText = 'margin:0 0 1.3rem;font-size:16px;color:#444;';
  statusEl.textContent = isEn ? 'Waiting for site to update…' : 'Venter på at nettstedet oppdateres…';
  var btns = document.createElement('div');
  btns.style.cssText = 'display:flex;gap:.7rem;justify-content:flex-end;';
  var closeBtn = document.createElement('button');
  closeBtn.type = 'button';
  closeBtn.style.cssText = 'padding:.6rem 1.4rem;border:1px solid #ccc;border-radius:5px;background:#fff;cursor:pointer;font-size:16px;font-family:inherit;';
  closeBtn.textContent = isEn ? 'Close' : 'Lukk';
  var doneBtn = document.createElement('button');
  doneBtn.type = 'button';
  doneBtn.style.cssText = 'display:none;padding:.6rem 1.5rem;border:none;border-radius:5px;background:#1a4a8a;color:#fff;cursor:pointer;font-size:16px;font-family:inherit;font-weight:600;';
  doneBtn.textContent = isEn ? 'Go to source page →' : 'Gå til kildesiden →';
  btns.appendChild(closeBtn); btns.appendChild(doneBtn);
  body.appendChild(statusEl); body.appendChild(btns);
  dlg.appendChild(hdr); dlg.appendChild(body);
  overlay.appendChild(dlg);
  document.body.appendChild(overlay);

  samtbuIncrementPending();
  var timer;

  function onBuildDone() {
    clearInterval(timer);
    samtbuDecrementPending();
    statusEl.textContent = isEn ? '✓ Published! Navigating to source page…' : '✓ Publisert! Navigerer til kildesiden…';
    doneBtn.style.display = 'inline-block';
    doneBtn.onclick = function() { overlay.remove(); window.location.href = sourcePerm + '?_=' + Date.now(); };
    setTimeout(function() { overlay.remove(); window.location.href = sourcePerm + '?_=' + Date.now(); }, 1500);
  }
  function onBuildError(reason) {
    clearInterval(timer);
    samtbuDecrementPending();
    statusEl.textContent = '⚠ ' + (reason || 'Feil');
  }

  if (oldEtag) {
    // ETag-basert polling – identisk logikk som pollQeBuild (inkl. GH Actions-fallback etter 180s)
    samtbuPlayStart();
    var attempts = 0;
    var _checking = false;
    timer = setInterval(function() {
      if (!overlay.isConnected) { clearInterval(timer); return; }
      if (++attempts > 180) {
        if (_checking) return;
        _checking = true;
        var _tok = getStoredToken();
        var _h2 = { 'Accept': 'application/vnd.github+json' };
        if (_tok) _h2['Authorization'] = 'token ' + _tok;
        fetch('https://api.github.com/repos/SAMT-X/samt-bu-docs/actions/workflows/hugo.yml/runs?per_page=5', { headers: _h2 })
          .then(function(r) { return r.json(); })
          .then(function(data) {
            _checking = false;
            var run = null;
            if (data.workflow_runs) {
              for (var i = 0; i < data.workflow_runs.length; i++) {
                if (new Date(data.workflow_runs[i].created_at).getTime() >= startTime - 30000) { run = data.workflow_runs[i]; break; }
              }
            }
            if (!run) { clearInterval(timer); samtbuPlayFailure(); onBuildError(isEn ? 'Timeout' : 'Tidsavbrudd'); return; }
            if (run.status === 'in_progress' || run.status === 'queued') {
              attempts = 0; // Bygg pågår – nullstill teller og fortsett ETag-poll
            } else if (run.status === 'completed' && run.conclusion === 'success') {
              clearInterval(timer); samtbuPlaySuccess(); onBuildDone();
            } else if (run.status === 'completed' && run.conclusion === 'cancelled') {
              attempts = 0; statusEl.textContent = isEn ? 'Cancelled – waiting for new build…' : 'Avbrutt – venter på nytt bygg…';
            } else {
              clearInterval(timer); samtbuPlayFailure(); onBuildError(run.conclusion || 'timeout');
            }
          })
          .catch(function() { _checking = false; clearInterval(timer); samtbuPlayFailure(); onBuildError(isEn ? 'Timeout' : 'Tidsavbrudd'); });
        return;
      }
      fetch(sourcePerm + '?_cf=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
        .then(function(r) {
          var newEtag = r.headers.get('etag') || r.headers.get('last-modified');
          if (r.ok && newEtag && newEtag !== oldEtag) { samtbuPlaySuccess(); onBuildDone(); }
          else statusEl.textContent = isEn ? 'Updating site (' + attempts + 's)…' : 'Nettstedet oppdateres (' + attempts + ' sek)…';
        })
        .catch(function() {});
    }, 1000);
  } else {
    // Fallback: startGhPoll (håndterer samtbuPlayStart/Success/Failure internt)
    timer = startGhPoll(startTime, onBuildDone, onBuildError, function(msg) {
      if (!overlay.isConnected) { clearInterval(timer); return; }
      statusEl.textContent = msg || '';
    });
  }

  var doClose = function() { clearInterval(timer); samtbuDecrementPending(); overlay.remove(); };
  closeBtn.onclick = doClose; xBtn.onclick = doClose;
}

function _mvCommit(token, repo, files, msg) {
  var base = 'https://api.github.com/repos/SAMT-X/' + repo;
  var h = { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
  var headSha;
  return fetch(base + '/git/ref/heads/main', { headers: h, cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(ref) {
      headSha = ref.object.sha;
      return fetch(base + '/git/commits/' + headSha, { headers: h, cache: 'no-store' });
    })
    .then(function(r) { return r.json(); })
    .then(function(commit) {
      var items = files.map(function(f) { return { path: f.path, mode: '100644', type: 'blob', content: f.content }; });
      return fetch(base + '/git/trees', { method: 'POST', headers: h, body: JSON.stringify({ base_tree: commit.tree.sha, tree: items }) });
    })
    .then(function(r) { return r.json(); })
    .then(function(tree) {
      return fetch(base + '/git/commits', { method: 'POST', headers: h, body: JSON.stringify({ message: msg, tree: tree.sha, parents: [headSha] }) });
    })
    .then(function(r) { return r.json(); })
    .then(function(newCommit) {
      return fetch(base + '/git/refs/heads/main', { method: 'PATCH', headers: h, body: JSON.stringify({ sha: newCommit.sha }) });
    })
    .then(function(r) {
      if (!r.ok) return r.json().then(function(j) { throw new Error(j.message || r.statusText); });
      return r.json();
    });
}

function _mvDoHit(position) {
  samtbuUnlockAudio(); // Lås opp Web Audio under brukergestus (klikk)
  var state = _mvGet();
  if (!state) return;
  var pg = window._samtbuThisPage || {};
  var token = getStoredToken();
  if (!token) { doGitHubLogin(function() { _mvDoHit(position); }); return; }
  var isEn = state.lang === 'en';
  var siblings = (state.siblings||[]).slice().sort(function(a,b){return a.weight-b.weight;});
  var others = siblings.filter(function(s){return s.relPermalink!==state.permalink;});
  var targetIdx = -1;
  for (var i=0;i<others.length;i++){if(others[i].relPermalink===pg.perm){targetIdx=i;break;}}
  if (targetIdx===-1){_mvMsg(isEn?'⚠ Not at same level – cross-level not yet supported.':'⚠ Ikke på samme nivå som kilden – støttes ikke ennå.',true);return;}
  if (others[targetIdx].repo!==state.repo){_mvMsg(isEn?'⚠ Different repo ('+others[targetIdx].repo+') – not yet supported.':'⚠ Annet repo ('+others[targetIdx].repo+') – støttes ikke ennå.',true);return;}
  var newWeight;
  if (position==='before'){newWeight=targetIdx===0?Math.max(1,others[0].weight-10):Math.round((others[targetIdx-1].weight+others[targetIdx].weight)/2);}
  else{newWeight=targetIdx===others.length-1?others[others.length-1].weight+10:Math.round((others[targetIdx].weight+others[targetIdx+1].weight)/2);}
  for (var j=0;j<others.length;j++){if(others[j].weight===newWeight){_mvMsg(isEn?'⚠ Weights too close – adjust via Edit dialog first.':'⚠ For like vekter – juster via Rediger-dialogen.',true);return;}}
  _mvMsg(isEn?'Saving…':'Lagrer…',false);
  var mvRepo=state.repo, mvDirPath=state.dirPath;
  var h={'Authorization':'token '+token,'Accept':'application/vnd.github+json'};
  var nbPath=mvDirPath+'/_index.nb.md', enPath=mvDirPath+'/_index.en.md';
  var startTime = Date.now();
  // Hent ETag for kildesiden + innhold parallelt – ETag garantert tilgjengelig ved commit-ferdig
  Promise.all([
    fetch(state.permalink + '?_pre=' + startTime, { method: 'HEAD', cache: 'no-store' })
      .then(function(r) { return r.headers.get('etag') || r.headers.get('last-modified') || null; })
      .catch(function() { return null; }),
    fetch('https://api.github.com/repos/SAMT-X/'+mvRepo+'/contents/'+nbPath,{headers:h,cache:'no-store'}).then(function(r){return r.json();}),
    fetch('https://api.github.com/repos/SAMT-X/'+mvRepo+'/contents/'+enPath,{headers:h,cache:'no-store'}).then(function(r){return r.json();})
  ]).then(function(res){
    var sourceEtag=res[0];
    var nbRaw=decodeURIComponent(escape(atob(res[1].content.replace(/\n/g,''))));
    var enRaw=decodeURIComponent(escape(atob(res[2].content.replace(/\n/g,''))));
    var nbNew=nbRaw.replace(/^(weight:\s*)\d+/m,'$1'+newWeight);
    var enNew=enRaw.replace(/^(weight:\s*)\d+/m,'$1'+newWeight);
    if(nbNew===nbRaw)throw new Error('weight-felt ikke funnet i nb-fil');
    if(enNew===enRaw)throw new Error('weight-felt ikke funnet i en-fil');
    var dir=mvDirPath.replace(/^content\//,'');
    return _mvCommit(token,mvRepo,[{path:nbPath,content:nbNew},{path:enPath,content:enNew}],'Flytt kapittel: ny vekt '+newWeight+(dir?' ('+dir+')':'')).then(function(){return sourceEtag;});
  }).then(function(sourceEtag){
    _mvClear();
    _mvRestoreMenu();  // Fjern dialog + reaktiver Endre-knapp
    _mvOpenBuildDialog(startTime, state.permalink, isEn, sourceEtag);
  }).catch(function(err){
    _mvMsg((isEn?'⚠ Error: ':'⚠ Feil: ')+err.message,true);
  });
}

function enterMoveMode(repo, dirPath, lang, permalink) {
  if (!getStoredToken()) {
    doGitHubLogin(function() { enterMoveMode(repo, dirPath, lang, permalink); });
    return;
  }
  var pg = window._samtbuThisPage || {};
  var state = {repo:repo, dirPath:dirPath, lang:lang, permalink:permalink,
    title:pg.title||'', siblings:window._samtbuMoveSiblings||[]};
  _mvSet(state);
  _mvApply(state);
}

var _mvResume = _mvGet();
if (_mvResume) _mvApply(_mvResume);
</script>

<!-- Behandle forslag: PR-oversikt på tvers av repoene (issue #60).
     Alle funksjoner er GLOBALE deklarasjoner – kalles fra onclick i edit-switcher
     og fra andre script-blokker. Se minifiseringsreglene i critical-notes. -->
<script>
var _prLang = 'nb';
var _prCache = null;          // { ts, prs }
var _prPerm = {};             // repo -> true/false
var PR_CACHE_TTL = 60000;     // 1 min

function _prIsEn() { return _prLang === 'en'; }

function _prEsc(str) {
  return String(str == null ? '' : str)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;')
    .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
}

function _prAgo(dateStr) {
  var isEn = _prIsEn();
  var secs = Math.round((Date.now() - new Date(dateStr).getTime()) / 1000);
  if (secs < 60)    return isEn ? 'just now' : 'akkurat nå';
  if (secs < 3600)  return Math.floor(secs / 60) + (isEn ? ' min ago' : ' min siden');
  if (secs < 86400) return Math.floor(secs / 3600) + (isEn ? ' h ago' : ' t siden');
  var d = Math.floor(secs / 86400);
  if (d === 1) return isEn ? 'yesterday' : 'i går';
  return d + (isEn ? ' days ago' : ' dager siden');
}

function _prSetStatus(msg) {
  var el = document.getElementById('pr-status-text');
  if (el) el.textContent = msg || '';
}

// Standardmelding etter merge. Bevisst uten tidsestimat («snart», ikke «om ett
// minutt») – se feedback om PR-akseptmeldinger.
function _prMergeComment() {
  return _prIsEn()
    ? 'Thank you – your suggestion has been approved and included. The website will be updated shortly.'
    : 'Takk for forslaget! Det er godkjent og tatt inn. Nettstedet oppdateres snart.';
}

function _prCloseComment() {
  return _prIsEn()
    ? 'Thank you for the suggestion. We are not taking this one forward, but the input is appreciated and noted.'
    : 'Takk for forslaget. Vi tar det ikke videre denne gangen, men innspillet er notert og satt pris på.';

function openPrDialog(lang) {
  _prLang = lang || 'nb';

  if (!overlay) return;

  if (!getStoredToken()) {

  document.getElementById('pr-heading').textContent = isEn ? 'Handle suggestions' : 'Behandle forslag';
  document.getElementById('pr-close-btn').textContent = isEn ? 'Close' : 'Lukk';
  document.getElementById('pr-refresh-btn').title = isEn ? 'Refresh' : 'Oppdater';

  if (overlay) overlay.style.display = 'none';
}

function _prLoad(force) {
  var isEn = _prIsEn();
  var listEl = document.getElementById('pr-list');
  if (!listEl) return;

  if (!force && _prCache && (Date.now() - _prCache.ts) < PR_CACHE_TTL) {
    _prRender(_prCache.prs);
    return;
  }

  // Egen klasse på lastetilstanden: uten den er «Laster…» og «Ingen åpne forslag»
  // samme element utenfra, og verken tester eller feilsøking kan skille dem.
  listEl.innerHTML = '<div class="pr-empty pr-loading">' + (isEn ? 'Loading…' : 'Laster…') + '</div>';
  _prSetStatus('');

  samtbuPrList().then(function(prs) {
    _prCache = { ts: Date.now(), prs: prs };
    // Hent skrivetilgang for de repoene som faktisk har forslag – cachet 1 t.
    var repos = [];
    prs.forEach(function(p) { if (repos.indexOf(p.repo) === -1) repos.push(p.repo); });
    return Promise.all(repos.map(function(r) {
      return samtbuCanWrite(r).then(function(ok) { _prPerm[r] = ok; });
    })).then(function() { return prs; });
  }).then(function(prs) {
    _prRender(prs);
  }).catch(function(err) {
    listEl.innerHTML = '<div class="pr-empty" style="color:#900; font-style:normal;">'
      + (isEn ? 'Could not load suggestions: ' : 'Kunne ikke hente forslag: ')
      + _prEsc(err.message) + '</div>';
  });
}

function _prRender(prs) {
  var isEn = _prIsEn();
  var listEl = document.getElementById('pr-list');
  if (!listEl) return;

  _prSetStatus(prs.length === 0 ? '' :
    (prs.length === 1 ? (isEn ? '1 open' : '1 åpent') : prs.length + (isEn ? ' open' : ' åpne')));

  if (prs.length === 0) {
    listEl.innerHTML = '<div class="pr-empty">'
      + (isEn ? 'No open suggestions. Nothing to handle right now.'
              : 'Ingen åpne forslag. Ingenting å behandle akkurat nå.') + '</div>';
    return;
  }

  var html = '';
  prs.forEach(function(pr) {
    var canWrite = !!_prPerm[pr.repo];
    var rowId = 'pr-row-' + pr.repo + '-' + pr.number;
    html += '<div class="pr-row" id="' + _prEsc(rowId) + '">'
      + '<div>'
      +   '<span class="pr-repo">' + _prEsc(pr.repo) + '</span>'
      +   '<a class="pr-title" href="' + _prEsc(pr.url) + '" target="_blank" rel="noopener">'
      +     _prEsc(pr.title) + '</a>'
      +   (pr.draft ? ' <span style="font-size:12px; color:#888;">('
      +     (isEn ? 'draft' : 'utkast') + ')</span>' : '')
      + '</div>'
      + '<div class="pr-meta">#' + pr.number + ' · '
      +   (isEn ? 'by ' : 'fra ') + _prEsc(pr.author)
      +   ' · ' + _prEsc(_prAgo(pr.updatedAt)) + '</div>'
      + '<div class="pr-actions">'
      +   '<a class="pr-btn" href="' + _prEsc(pr.url) + '/files" target="_blank" rel="noopener"'
      +     ' style="text-decoration:none;">' + (isEn ? 'See changes' : 'Se endringene') + '</a>';
    if (canWrite) {
      html += '<button type="button" class="pr-btn pr-btn-merge"'
        +   ' data-pr-act="merge" data-pr-repo="' + _prEsc(pr.repo) + '" data-pr-num="' + pr.number + '">'
        +   (isEn ? 'Merge' : 'Slå sammen') + '</button>'
        + '<button type="button" class="pr-btn pr-btn-close"'
        +   ' data-pr-act="close" data-pr-repo="' + _prEsc(pr.repo) + '" data-pr-num="' + pr.number + '">'
        +   (isEn ? 'Decline' : 'Avslå') + '</button>';
    } else {
      html += '<span style="font-size:13px; color:#889;">'
        + (isEn ? 'You do not have write access to this repository'
                : 'Du har ikke skrivetilgang til dette repoet') + '</span>';
    }
    html += '</div><div class="pr-note" style="display:none;"></div></div>';
  });
  listEl.innerHTML = html;
}

// To-stegs bekreftelse: første klikk ber om bekreftelse i raden, andre utfører.
function _prConfirm(btn, repo, number, act) {
  var isEn = _prIsEn();
  var row = document.getElementById('pr-row-' + repo + '-' + number);
  if (!row) return;
  var note = row.querySelector('.pr-note');

  if (btn.dataset.prArmed === '1') {
    _prExecute(row, btn, repo, number, act);
    return;
  }

  // Avvæpne alle andre knapper først
  _prDisarmAll();
  btn.dataset.prArmed = '1';
  btn.dataset.prLabel = btn.textContent;
  btn.textContent = isEn ? 'Confirm' : 'Bekreft';
  note.className = 'pr-note pr-note-ok';
  note.style.display = 'block';
  note.textContent = act === 'merge'
    ? (isEn ? 'This includes the changes in the website and posts a thank-you comment to the contributor. Click "Confirm" to proceed.'
            : 'Dette tar endringene inn i nettstedet og legger igjen en takkekommentar til bidragsyteren. Klikk «Bekreft» for å fullføre.')
    : (isEn ? 'This declines the suggestion and posts a friendly comment. Nothing is deleted – it can be reopened in GitHub. Click "Confirm" to proceed.'
            : 'Dette avslår forslaget og legger igjen en vennlig kommentar. Ingenting slettes – det kan gjenåpnes i GitHub. Klikk «Bekreft» for å fullføre.');
}

function _prDisarmAll() {
  var btns = document.querySelectorAll('#pr-list [data-pr-act]');
  for (var i = 0; i < btns.length; i++) {
    if (btns[i].dataset.prArmed === '1') {
      btns[i].dataset.prArmed = '0';
      if (btns[i].dataset.prLabel) btns[i].textContent = btns[i].dataset.prLabel;
      var r = btns[i].closest('.pr-row');
      var n = r && r.querySelector('.pr-note');
      if (n) { n.style.display = 'none'; n.textContent = ''; }
    }
  }
}

function _prExecute(row, btn, repo, number, act) {
  var isEn = _prIsEn();
  var note = row.querySelector('.pr-note');
  var allBtns = row.querySelectorAll('[data-pr-act]');
  for (var i = 0; i < allBtns.length; i++) allBtns[i].disabled = true;

  note.className = 'pr-note pr-note-ok';
  note.style.display = 'block';
  note.textContent = act === 'merge'
    ? (isEn ? 'Merging…' : 'Slår sammen…')
    : (isEn ? 'Declining…' : 'Avslår…');

  var op = act === 'merge'
    ? samtbuPrMerge(repo, number)
    : samtbuPrClose(repo, number);

  op.then(function() {
    // Kommentaren er en høflighet, ikke en forutsetning – en feil her skal ikke
    // få handlingen til å se mislykket ut.
    return samtbuPrComment(repo, number,
      act === 'merge' ? _prMergeComment() : _prCloseComment()
    ).catch(function() { return null; });
  }).then(function() {
    note.className = 'pr-note pr-note-ok';
    note.textContent = act === 'merge'
      ? (isEn ? 'Merged. The website will rebuild shortly.'
              : 'Slått sammen. Nettstedet bygges på nytt snart.')
      : (isEn ? 'Declined and commented.' : 'Avslått, med kommentar.');
    row.style.opacity = '.6';
    _prCache = null;   // tving ny henting neste gang
  }).catch(function(err) {
    note.className = 'pr-note pr-note-err';
    var msg = err.message || '';
    if (err.status === 405 || /not mergeable|conflict/i.test(msg)) {
      msg = isEn
        ? 'This suggestion conflicts with the current content and cannot be merged automatically. It has to be resolved in GitHub.'
        : 'Dette forslaget er i konflikt med gjeldende innhold og kan ikke slås sammen automatisk. Det må løses i GitHub.';
    } else if (err.status === 403) {
      msg = isEn
        ? 'GitHub declined the action – you may not have sufficient rights to this repository.'
        : 'GitHub avviste handlingen – du har kanskje ikke tilstrekkelige rettigheter til dette repoet.';
    }
    note.textContent = (isEn ? '⚠ ' : '⚠ ') + msg;
    for (var j = 0; j < allBtns.length; j++) allBtns[j].disabled = false;
    btn.dataset.prArmed = '0';
    if (btn.dataset.prLabel) btn.textContent = btn.dataset.prLabel;
  });
}

// Viser admin-gruppen i Endre-menyen dersom brukeren har skrivetilgang.
// Gates på repoet for GJELDENDE side – rettighetssjekk på tvers av ti repoer
// ved hver sidelast ville vært for dyrt. Skjuling er kosmetikk, ikke sikkerhet.
function samtbuUpdateAdminMenu() {
  if (!window._samtbuThisPage) return;
  if (!getStoredToken()) {
    var g0 = document.getElementById('samt-bu-admin-group');
    var i0 = document.getElementById('samt-bu-admin-prs');
    if (g0) g0.style.display = 'none';
    if (i0) i0.style.display = 'none';
    return;
  }
  checkCollaboratorPermission(window._samtbuThisPage.repo, function(canWrite) {
    var group = document.getElementById('samt-bu-admin-group');
    var item  = document.getElementById('samt-bu-admin-prs');
    if (!group || !item) return;
    group.style.display = canWrite ? 'block' : 'none';
    item.style.display  = canWrite ? 'block' : 'none';
    if (canWrite) _prUpdateMenuCount();
  });
}

// Antall åpne forslag i menyetiketten. Bruker sessionStorage slik at tallet
// ikke koster ti API-kall ved hver sidevisning.
function _prUpdateMenuCount() {
  var label = document.getElementById('samt-bu-admin-prs-label');
  if (!label) return;
  var lang = (window._samtbuThisPage && window._samtbuThisPage.lang) || 'nb';
  var base = lang === 'en' ? 'Handle suggestions' : 'Behandle forslag';

  function paint(n) { label.textContent = n > 0 ? base + ' (' + n + ')' : base; }

  try {
    var c = JSON.parse(sessionStorage.getItem('samt-bu-prs-v1'));
    if (c && (Date.now() - c.ts) < 300000) { paint(c.n); return; }
  } catch(e) {}

  samtbuPrList().then(function(prs) {
    try { sessionStorage.setItem('samt-bu-prs-v1', JSON.stringify({ ts: Date.now(), n: prs.length })); } catch(e) {}
    paint(prs.length);
  }).catch(function() {});
}

(function() {
  var overlay = document.getElementById('pr-overlay');
  if (!overlay) return;

  var closeBtn = document.getElementById('pr-close-btn');
  if (closeBtn) closeBtn.addEventListener('click', closePrDialog);

  var refreshBtn = document.getElementById('pr-refresh-btn');
  if (refreshBtn) refreshBtn.addEventListener('click', function() {
    try { sessionStorage.removeItem('samt-bu-prs-v1'); } catch(e) {}
    _prCache = null;
    _prLoad(true);
  });

  // Delegert klikk – radene bygges på nytt ved hver rendring.
  var listEl = document.getElementById('pr-list');
  if (listEl) listEl.addEventListener('click', function(e) {
    var btn = e.target.closest('[data-pr-act]');
    if (!btn || btn.disabled) return;
    _prConfirm(btn, btn.dataset.prRepo, btn.dataset.prNum, btn.dataset.prAct);
  });

  document.addEventListener('keydown', function(e) {
    if (e.key !== 'Escape') return;
    if (overlay.style.display === 'none' || !overlay.style.display) return;
    if (document.querySelector('#pr-list [data-pr-armed="1"]')) { _prDisarmAll(); return; }
    closePrDialog();
  });

  samtbuUpdateAdminMenu();
})();
</script>
