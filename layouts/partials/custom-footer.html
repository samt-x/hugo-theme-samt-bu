    document.getElementById('del-confirm-section').style.display = 'block';
    document.getElementById('del-confirm-section-2').style.display = 'none';
    overlay.style.display = 'flex';
  };

  function closeDialog() {
    overlay.style.display = 'none';
    document.getElementById('del-confirm-section').style.display = 'block';
    document.getElementById('del-confirm-section-2').style.display = 'none';
    document.getElementById('del-build-section').style.display = 'none';
    // activePollTimer stoppes IKKE her – polling fortsetter i bakgrunnen
    // slik at navigering skjer automatisk når bygget er ferdig
  }

  overlay.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeDialog(); e.stopPropagation(); });
  document.getElementById('del-close-x').addEventListener('click', closeDialog);
  document.getElementById('del-cancel').addEventListener('click', closeDialog);
  document.getElementById('del-panel-close').addEventListener('click', closeDialog);

  document.getElementById('del-confirm-btn').addEventListener('click', function() {
    if (delChildCount > 0) { showStep2(); } else { doCommit(); }
  });

  function showStep2() {
    var lang = delLang;
    var subLabel = lang === 'en'
      ? (delChildCount === 1 ? '1 sub-chapter' : delChildCount + ' sub-chapters')
      : (delChildCount === 1 ? '1 underkapittel' : delChildCount + ' underkapitler');
    document.getElementById('del-s2-title').textContent =
      lang === 'en' ? 'Are you absolutely sure?' : 'Er du helt sikker?';
    document.getElementById('del-s2-text').textContent = lang === 'en'
      ? 'You are about to delete \u201c' + delTitle + '\u201d and all ' + subLabel + '. This cannot be undone via the website (but can be restored from the GitHub commit history by an administrator). Note: It has not been checked whether other pages link to any of the pages being deleted \u2014 such links may break.'
      : 'Du er i ferd med å slette \u00ab' + delTitle + '\u00bb og alle ' + subLabel + '. Dette kan ikke angres via nettstedet (men kan gjenopprettes fra GitHub-commit-historikken av en administrator). Merk: Det er ikke sjekket om andre sider lenker til noen av sidene som slettes \u2014 slike lenker kan bli brutte.';
    document.getElementById('del-back-btn').textContent = lang === 'en' ? '\u2190 Back' : '\u2190 Tilbake';
    document.getElementById('del-final-btn').textContent = lang === 'en' ? 'Yes, delete permanently' : 'Ja, slett alt permanent';
    document.getElementById('del-final-btn').disabled = false;
    document.getElementById('del-back-btn').disabled = false;
    document.getElementById('del-confirm-section').style.display = 'none';
    document.getElementById('del-confirm-section-2').style.display = 'block';
  }

  document.getElementById('del-back-btn').addEventListener('click', function() {
    document.getElementById('del-confirm-section-2').style.display = 'none';
    document.getElementById('del-confirm-section').style.display = 'block';
  });

  document.getElementById('del-final-btn').addEventListener('click', function() { doCommit(); });

  function doCommit() {
    var token = getStoredToken();
    if (!token) { closeDialog(); return; }
    samtbuUnlockAudio();

    var confirmBtn = document.getElementById('del-confirm-btn');
    var cancelBtn  = document.getElementById('del-cancel');
    var finalBtn   = document.getElementById('del-final-btn');
    var backBtn    = document.getElementById('del-back-btn');
    var spinText   = delLang === 'en' ? 'Deleting\u2026' : 'Sletter\u2026';
    confirmBtn.disabled = true; confirmBtn.textContent = spinText;
    cancelBtn.disabled  = true;
    finalBtn.disabled   = true; finalBtn.textContent = spinText;
    backBtn.disabled    = true;

    var startTime = Date.now();
    var nbPath = delDirPath + '/_index.nb.md';
    var enPath = delDirPath + '/_index.en.md';

    checkCollaboratorPermission(delRepo, function(canWrite) {
      var branchName = canWrite ? null : makePrBranch();
      var delLogin = localStorage.getItem('samt-bu-gh-user') || 'unknown';
      var commitMsg = (delLang === 'en' ? 'Delete page: ' : 'Slett side: ') + delTitle;

      function tryDelCommit(attemptsLeft, org) {
        var doDelete = delChildCount > 0
          ? deleteDirectoryRecursive(token, delRepo, delDirPath, commitMsg, branchName, org)
          : deleteFilesInOneCommit(token, delRepo, [nbPath, enPath], commitMsg, branchName, org);
        return doDelete.catch(function(err) {
          if (err.message === 'Update is not a fast forward' && !branchName && attemptsLeft > 0) {
            return new Promise(function(res) { setTimeout(res, 1500); })
              .then(function() { return tryDelCommit(attemptsLeft - 1, org); });
          }
          throw err;
        });
      }
      var delSuggestItems = delChildCount > 0 ? null : [
        {path: nbPath, mode: '100644', type: 'blob', sha: null},
        {path: enPath, mode: '100644', type: 'blob', sha: null}
      ];
      var delSuggestPrefix = delChildCount > 0 ? delDirPath : null;
      var delPrTitle = (delLang === 'en' ? 'Suggest deletion: ' : 'Foreslår sletting: ') + delTitle;
      var delPrBody = delLang === 'en'
        ? 'Deletion suggested by @' + delLogin + ' via SAMT-BU Docs.'
        : 'Sletting foreslått av @' + delLogin + ' via SAMT-BU Docs.';
      var delPromise = canWrite
        ? tryDelCommit(2)
        : suggestViaWorker(delRepo, branchName, delSuggestItems, delSuggestPrefix, commitMsg, delPrTitle, delPrBody);
      delPromise
        .then(function(result) {
          if (canWrite) {
            showBuildPanel();
            samtbuIncrementPending();
            pollBuild(startTime);
          } else {
            showBuildPanel();
            document.getElementById('del-heading').textContent =
              delLang === 'en' ? 'Suggestion sent!' : 'Forslag sendt!';
            var buildText = document.getElementById('del-build-status-text');
            if (buildText) buildText.innerHTML = (delLang === 'en' ? 'Pull request created: ' : 'Pull request opprettet: ') +
              (result && result.html_url ? '<a href="' + result.html_url + '" target="_blank">#' + result.number + '</a>' : '');
            var doneBtn = document.getElementById('del-panel-done');
            if (doneBtn) { doneBtn.style.display = 'inline-block'; doneBtn.onclick = closeDialog; }
            var closeBtn = document.getElementById('del-panel-close');
            if (closeBtn) closeBtn.style.display = 'none';
          }
        })        .catch(function(err) {
          document.getElementById('del-confirm-section-2').style.display = 'none';
          document.getElementById('del-confirm-section').style.display = 'block';
          var errEl = document.getElementById('del-error');
          errEl.style.display = 'block';
          errEl.textContent = (delLang === 'en' ? 'Error: ' : 'Feil: ') + err.message;
          confirmBtn.disabled = false;
          confirmBtn.textContent = delLang === 'en' ? 'Delete page' : 'Slett siden';
          cancelBtn.disabled = false;
          finalBtn.disabled = false;
          backBtn.disabled = false;
        });
    });
  }

  function deleteFilesInOneCommit(token, repo, paths, commitMsg, targetBranch, org) {
    var apiBase = 'https://api.github.com/repos/' + (org || 'SAMT-X') + '/' + repo;
    var h = { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
    var headSha;
    var branch = targetBranch || 'main';
    return fetch(apiBase + '/git/ref/heads/main', { headers: h, cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(ref) {
        headSha = ref.object.sha;
        if (targetBranch) {
          return fetch(apiBase + '/git/refs', { method: 'POST', headers: h, body: JSON.stringify({ ref: 'refs/heads/' + targetBranch, sha: headSha }) })
            .then(function(r) { if (!r.ok) return r.json().then(function(j) { throw new Error(j.message || r.statusText); }); })
            .then(function() { return fetch(apiBase + '/git/commits/' + headSha, { headers: h }); });
        }
        return fetch(apiBase + '/git/commits/' + headSha, { headers: h });
      })
      .then(function(r) { return r.json(); })
      .then(function(commit) {
        var items = paths.map(function(p) { return { path: p, mode: '100644', type: 'blob', sha: null }; });
        return fetch(apiBase + '/git/trees', { method: 'POST', headers: h, body: JSON.stringify({ base_tree: commit.tree.sha, tree: items }) });
      })
      .then(function(r) { return r.json(); })
      .then(function(tree) {
        return fetch(apiBase + '/git/commits', { method: 'POST', headers: h, body: JSON.stringify({ message: commitMsg, tree: tree.sha, parents: [headSha] }) });
      })
      .then(function(r) { return r.json(); })
      .then(function(newCommit) {
        return fetch(apiBase + '/git/refs/heads/' + branch, { method: 'PATCH', headers: h, body: JSON.stringify({ sha: newCommit.sha }) });
      })
      .then(function(r) {
        if (!r.ok) return r.json().then(function(j) { throw new Error(j.message || r.statusText); });
        return r.json();
      });
  }

  function deleteDirectoryRecursive(token, repo, dirPath, commitMsg, targetBranch, org) {
    var apiBase = 'https://api.github.com/repos/' + (org || 'SAMT-X') + '/' + repo;
    var h = { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
    var branch = targetBranch || 'main';
    return fetch(apiBase + '/git/refs/heads/main', { headers: h, cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(ref) {
        var headSha = ref.object.sha;
        var branchPromise = targetBranch
          ? fetch(apiBase + '/git/refs', { method: 'POST', headers: h, body: JSON.stringify({ ref: 'refs/heads/' + targetBranch, sha: headSha }) })
              .then(function(r) { if (!r.ok) return r.json().then(function(j) { throw new Error(j.message || r.statusText); }); })
          : Promise.resolve();
        return branchPromise.then(function() {
          return fetch(apiBase + '/git/trees/' + headSha + '?recursive=1', { headers: h, cache: 'no-store' })
            .then(function(r) { return r.json(); })
            .then(function(tree) {
              var prefix = dirPath.replace(/\/$/, '') + '/';
              var deletions = tree.tree
                .filter(function(item) { return item.type === 'blob' && item.path.indexOf(prefix) === 0; })
                .map(function(item) { return { path: item.path, mode: item.mode, type: item.type, sha: null }; });
              if (deletions.length === 0) return;
              return fetch(apiBase + '/git/trees', {
                method: 'POST', headers: h,
                body: JSON.stringify({ base_tree: headSha, tree: deletions })
              })
                .then(function(r) { return r.json(); })
                .then(function(newTree) {
                  return fetch(apiBase + '/git/commits', {
                    method: 'POST', headers: h,
                    body: JSON.stringify({ message: commitMsg, tree: newTree.sha, parents: [headSha] })
                  });
                })
                .then(function(r) { return r.json(); })
                .then(function(commit) {
                  return fetch(apiBase + '/git/refs/heads/' + branch, {
                    method: 'PATCH', headers: h,
                    body: JSON.stringify({ sha: commit.sha })
                  });
                })
                .then(function(r) { return r.json(); });
            });
        });
      });
  }

  function showBuildPanel() {
    document.getElementById('del-confirm-section').style.display = 'none';
    document.getElementById('del-confirm-section-2').style.display = 'none';
    document.getElementById('del-build-section').style.display = 'block';
    document.getElementById('del-heading').textContent =
      delLang === 'en' ? 'Deleting "' + delTitle + '"…' : 'Sletter «' + delTitle + '»…';
    document.getElementById('del-build-status-text').textContent =
      delLang === 'en' ? 'Updating site (0s)…' : 'Nettsted oppdateres (0 sek)…';
    document.getElementById('del-panel-done').style.display = 'none';
  }

  function showJobIndicator() {
    var el = document.getElementById('del-job-indicator');
    if (el) el.style.display = 'flex';
  }

  function hideJobIndicator() {
    var el = document.getElementById('del-job-indicator');
    if (el) el.style.display = 'none';
  }

  function navAfterDelete() {
    var url = delParentUrl;
    url += (url.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
    window.location.href = url;
  }

  function pollBuild(startTime) {
    var lang = delLang;
    var pageUrl = window.location.href.split('?')[0];
    var attempts = 0;

    samtbuPlayStart();

    document.getElementById('del-panel-done').onclick = function() {
      clearInterval(activePollTimer); activePollTimer = null;
      navAfterDelete();
    };

    function onDone() {
      clearInterval(activePollTimer); activePollTimer = null;
      samtbuPlaySuccess();
      var doneBtn = document.getElementById('del-panel-done');
      if (doneBtn) doneBtn.style.display = 'inline-block';
      var secs = 3;
      var statusEl = document.getElementById('del-build-status-text');
      if (statusEl) statusEl.textContent = (lang === 'en' ? '✓ Done! Navigating in ' : '✓ Ferdig! Navigerer om ') + secs + (lang === 'en' ? 's…' : ' sek…');
      var cdTimer = setInterval(function() {
        secs--;
        if (secs <= 0) { clearInterval(cdTimer); navAfterDelete(); return; }
        var el = document.getElementById('del-build-status-text');
        if (el) el.textContent = (lang === 'en' ? '✓ Done! Navigating in ' : '✓ Ferdig! Navigerer om ') + secs + (lang === 'en' ? 's…' : ' sek…');
      }, 1000);
    }

    // Poll nåværende side-URL – vent på 404 (siden forsvinner fra CF CDN)
    activePollTimer = setInterval(function() {
      if (++attempts > 120) {
        clearInterval(activePollTimer); activePollTimer = null;
        var statusEl = document.getElementById('del-build-status-text');
        if (statusEl) statusEl.textContent = '⚠ ' + (lang === 'en' ? 'Timed out' : 'Tidsavbrudd');
        var doneBtn = document.getElementById('del-panel-done');
        if (doneBtn) doneBtn.style.display = 'inline-block';
        return;
      }
      fetch(pageUrl + '?_cf=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
        .then(function(r) {
          if (r.status === 404) {
            onDone();
          } else {
            var statusEl = document.getElementById('del-build-status-text');
            if (statusEl) statusEl.textContent = lang === 'en' ? 'Updating site (' + attempts + 's)…' : 'Nettsted oppdateres (' + attempts + ' sek)…';
          }
        })
        .catch(function() {});
    }, 1000);
  }
})();

</script>

<!-- Rediger innhold: TipTap WYSIWYG – hent eksisterende side, rediger, lagre til GitHub -->
<script>
(function() {
  var overlay = document.getElementById('qe-overlay');
  if (!overlay) return;

  var qeRepo = '', qeFilePath = '', qeLang = 'nb', qePageTitle = '', qePermalink = '';
  var qeFrontmatter = '', qeEditor = null, qePollTimer = null, qeOriginalTitle = '';
  var qeImages = {}, qeImageMap = {};

  function parseFrontmatter(content) {
    var m = content.match(/^---\n([\s\S]*?)\n---\n?([\s\S]*)$/);
    if (m) return { frontmatter: '---\n' + m[1] + '\n---\n', body: m[2].trim() };
    return { frontmatter: '', body: content.trim() };
  }

  function qeYamlStr(s) {
    if (/[:#\[\]{}&*!|>'"%@`,]/.test(s) || s !== s.trim()) {
      return '"' + s.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
    }
    return s;
  }

  function parseFmField(fm, key) {
    var m = fm.match(new RegExp('^' + key + ':\\s*(.*)$', 'm'));
    if (!m) return '';
    var v = m[1].trim();
    if (v.length >= 2 && ((v[0] === '"' && v[v.length-1] === '"') || (v[0] === "'" && v[v.length-1] === "'"))) {
      v = v.slice(1, -1).replace(/\\"/g, '"');
    }
    return v;
  }

  function setFmField(fm, key, line) {
    if (new RegExp('^' + key + ':', 'm').test(fm)) {
      return fm.replace(new RegExp('^' + key + ':.*$', 'm'), line);
    }
    return fm.replace(/\n---\n$/, '\n' + line + '\n---\n');
  }

  function removeFmField(fm, key) {
    return fm.replace(new RegExp('^' + key + ':.*\\n', 'm'), '');
  }

  function setStatus(text) {
    var el = document.getElementById('qe-status-text');
    if (el) el.textContent = text;
  }

  function setupQeToolbar(editor) {
    var toolbar = document.getElementById('qe-toolbar');
    if (!toolbar) return;
    toolbar.addEventListener('click', function(e) {
      var btn = e.target.closest('[data-qe]');
      if (!btn) return;
      e.preventDefault();
      var cmd = btn.getAttribute('data-qe');
      switch(cmd) {
        case 'bold':         editor.chain().focus().toggleBold().run(); break;
        case 'italic':       editor.chain().focus().toggleItalic().run(); break;
        case 'h2':           editor.chain().focus().toggleHeading({ level: 2 }).run(); break;
        case 'h3':           editor.chain().focus().toggleHeading({ level: 3 }).run(); break;
        case 'ul':           editor.chain().focus().toggleBulletList().run(); break;
        case 'ol':           editor.chain().focus().toggleOrderedList().run(); break;
        case 'link':
          var url = window.prompt('URL:');
          if (url) editor.chain().focus().setLink({ href: url }).run();
          else if (editor.isActive('link')) editor.chain().focus().unsetLink().run();
          break;
        case 'table':        editor.chain().focus().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run(); break;
        case 'addRowBefore': editor.chain().focus().addRowBefore().run(); break;
        case 'addRowAfter':  editor.chain().focus().addRowAfter().run(); break;
        case 'deleteRow':    editor.chain().focus().deleteRow().run(); break;
        case 'addColBefore': editor.chain().focus().addColumnBefore().run(); break;
        case 'addColAfter':  editor.chain().focus().addColumnAfter().run(); break;
        case 'deleteCol':    editor.chain().focus().deleteColumn().run(); break;
        case 'clear':        editor.chain().focus().clearNodes().unsetAllMarks().run(); break;
      }
    });
    editor.on('selectionUpdate', function() { updateQeToolbarState(editor); });
    editor.on('transaction',     function() { updateQeToolbarState(editor); });
  }

  function updateQeToolbarState(editor) {
    var tb = document.getElementById('qe-toolbar');
    if (!tb) return;
    tb.querySelectorAll('[data-qe]').forEach(function(btn) {
      var cmd = btn.getAttribute('data-qe');
      var active = false;
      if      (cmd === 'bold')   active = editor.isActive('bold');
      else if (cmd === 'italic') active = editor.isActive('italic');
      else if (cmd === 'h2')     active = editor.isActive('heading', { level: 2 });
      else if (cmd === 'h3')     active = editor.isActive('heading', { level: 3 });
      else if (cmd === 'ul')     active = editor.isActive('bulletList');
      else if (cmd === 'ol')     active = editor.isActive('orderedList');
      else if (cmd === 'link')   active = editor.isActive('link');
      btn.classList.toggle('is-active', active);
    });
  }

  window.openEditDialog = function(repo, filePath, lang, pageTitle, permalink) {
    qeRepo = repo; qeFilePath = filePath; qeLang = lang || 'nb';
    qePageTitle = pageTitle; qePermalink = permalink || '';
    qeImages = {}; qeImageMap = {};

    if (!getStoredToken()) {
      doGitHubLogin(function() {
        window.openEditDialog(repo, filePath, lang, pageTitle, permalink);
      });
      return;
    }
    var token = getStoredToken();

    var cleanTitle = (typeof pageTitle === 'string') ? pageTitle.replace(/^"(.*)"$/, '$1') : pageTitle;
    document.getElementById('qe-title').textContent = (lang === 'en' ? 'Edit page: ' : 'Rediger side: ') + cleanTitle;
    var saveBtn = document.getElementById('qe-save-btn');
    saveBtn.disabled = true;
    saveBtn.onclick = null;
    saveBtn.textContent = lang === 'en' ? 'Save' : 'Lagre';
    saveBtn.style.background = '';
    saveBtn.style.cursor = '';
    var cancelBtn = document.getElementById('qe-cancel-btn');
    if (cancelBtn) { cancelBtn.textContent = lang === 'en' ? 'Cancel' : 'Avbryt'; cancelBtn.onclick = null; }
    setStatus(lang === 'en' ? 'Loading…' : 'Laster…');
    overlay.style.display = 'flex';
    window._applyDialogPos && window._applyDialogPos('qe-overlay');

    // Sjekk om bygg pågår – vis advarsel (blokkerer ikke)
    checkBuildInProgress(qeFilePath, function(active) {
      var w = document.getElementById('qe-build-warning');
      if (w) w.style.display = active ? 'block' : 'none';
    });
    // Varm opp brukernavn-cache og start presence-sporing
    fetchCurrentUser(function() { presenceOpen('qe', permalink); });

    loadTiptap(function() {
      var T = window._Tiptap;
      if (!qeEditor) {
        qeEditor = new T.Editor({
          element: document.getElementById('qe-body-pm'),
          extensions: [
            T.StarterKit,
            T.Table.configure({ resizable: false }),
            T.TableRow,
            T.TableCell,
            T.TableHeader,
            T.Link.configure({ openOnClick: false }),
            T.Image,
            T.Markdown.configure({ html: false, transformPastedText: true })
          ],
          content: ''
        });
        setupQeToolbar(qeEditor);
        qeEditor.view.dom.addEventListener('paste', function(e) {
          var items = e.clipboardData && e.clipboardData.items;
          if (!items) return;
          for (var i = 0; i < items.length; i++) {
            if (items[i].type.indexOf('image') !== -1) {
              e.preventDefault();
              (function(item) {
                var ext = item.type === 'image/jpeg' ? 'jpg' : 'png';
                var fname = 'bilde-' + Date.now() + '.' + ext;
                var reader = new FileReader();
                reader.onload = function(evt) {
                  var dataUrl = evt.target.result;
                  qeImages[fname] = dataUrl.split(',')[1];
                  qeImageMap[dataUrl] = fname;
                  qeEditor.chain().focus().setImage({ src: dataUrl }).run();
                };
                reader.readAsDataURL(item.getAsFile());
              })(items[i]);
              break;
            }
          }
        }, true);
      } else {
        qeEditor.commands.setContent('');
        qeImages = {}; qeImageMap = {};
      }

      var h = { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' };
      fetch('https://api.github.com/repos/SAMT-X/' + qeRepo + '/contents/' + qeFilePath, { headers: h })
        .then(function(r) { if (!r.ok) throw new Error(r.status); return r.json(); })
        .then(function(data) {
          var raw = decodeURIComponent(escape(atob(data.content.replace(/\n/g, ''))));
          var parsed = parseFrontmatter(raw);
          qeFrontmatter = parsed.frontmatter;
          qeEditor.commands.setContent(parsed.body || '');

          // Fyll inn metadata-felter
          document.getElementById('qe-field-title').value    = parseFmField(qeFrontmatter, 'title');
          document.getElementById('qe-field-linktitle').value = parseFmField(qeFrontmatter, 'linkTitle');
          qeOriginalTitle = parseFmField(qeFrontmatter, 'title');
          document.getElementById('qe-field-title').oninput = function() {
            var lt = document.getElementById('qe-field-linktitle');
            if (lt.value === qeOriginalTitle) lt.value = this.value;
            qeOriginalTitle = this.value;
          };
          document.getElementById('qe-field-weight').value   = parseFmField(qeFrontmatter, 'weight');
          var currentStatus = parseFmField(qeFrontmatter, 'status');
          var statusOpts = qeLang === 'en'
            ? ['', 'New', 'Early draft', 'In progress', 'For QA', 'Approved', 'Cancelled']
            : ['', 'Ny', 'Tidlig utkast', 'Pågår', 'Til QA', 'Godkjent', 'Avbrutt'];
          var sel = document.getElementById('qe-field-status');
          sel.innerHTML = '';
          statusOpts.forEach(function(opt) {
            var o = document.createElement('option');
            o.value = opt; o.textContent = opt || (qeLang === 'en' ? '(none)' : '(ingen)');
            if (opt === currentStatus) o.selected = true;
            sel.appendChild(o);
          });

          document.getElementById('qe-field-hidetoc').checked = parseFmField(qeFrontmatter, 'hide_toc') !== 'true';
          document.getElementById('qe-field-draft').checked = parseFmField(qeFrontmatter, 'draft') === 'true';

          // Gjenopprett redigeringsinnhold fra sessionStorage (etter navigering)
          var _r = window._dlgRestoring;
          if (_r && _r.type === 'qe' && _r.filePath === qeFilePath) {
            delete window._dlgRestoring;
            qeEditor.commands.setContent(_r.content);
            var ftEl = document.getElementById('qe-field-title');
            if (ftEl && _r.fieldTitle !== undefined) ftEl.value = _r.fieldTitle;
            var ltEl = document.getElementById('qe-field-linktitle');
            if (ltEl && _r.fieldLinkTitle !== undefined) ltEl.value = _r.fieldLinkTitle;
            var fwEl = document.getElementById('qe-field-weight');
            if (fwEl && _r.fieldWeight !== undefined) fwEl.value = _r.fieldWeight;
            var fsEl = document.getElementById('qe-field-status');
            if (fsEl && _r.fieldStatus !== undefined) fsEl.value = _r.fieldStatus;
          }
          setStatus('');
          saveBtn.disabled = false;
          qeEditor.commands.focus();

          // Dirty-deteksjon: merk endring ved første TipTap-oppdatering eller feltendring
          qeEditor.on('update', function() { presenceMarkDirty(); });
          ['qe-field-title','qe-field-linktitle','qe-field-weight','qe-field-status','qe-field-hidetoc'].forEach(function(id) {
            var el = document.getElementById(id);
            if (el) el.addEventListener('change', function() { presenceMarkDirty(); }, { once: true });
          });
        })
        .catch(function(err) { setStatus('Feil ved innlasting: ' + err.message); });
    });
  };

  function closeQeDialog() {
    presenceClose();
    overlay.style.display = 'none';
    if (qePollTimer) {
      var ind = document.getElementById('qe-job-indicator');
      if (ind) ind.style.display = 'flex';
    }
  }

  document.getElementById('qe-cancel-btn').addEventListener('click', closeQeDialog);
  overlay.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeQeDialog(); e.stopPropagation(); });

  window._dlgSaveQe = function() {
    var el = document.getElementById('qe-overlay');
    if (!el || el.style.display === 'none' || !qeEditor) return null;
    return { type:'qe', repo:qeRepo, filePath:qeFilePath, lang:qeLang,
      pageTitle:qePageTitle, permalink:qePermalink,
      content:qeEditor.getJSON(),
      fieldTitle:(document.getElementById('qe-field-title')||{}).value||'',
      fieldLinkTitle:(document.getElementById('qe-field-linktitle')||{}).value||'',
      fieldWeight:(document.getElementById('qe-field-weight')||{}).value||'',
      fieldStatus:(document.getElementById('qe-field-status')||{}).value||'' };
  };

  document.getElementById('qe-save-btn').addEventListener('click', function() {
    var token = getStoredToken();
    if (!token || !qeEditor) return;
    var saveBtn = document.getElementById('qe-save-btn');
    if (saveBtn.onclick) return; // er i "lukk"-modus – la onclick håndtere det
    samtbuUnlockAudio(); // lås opp lyd under brukergestus
    saveBtn.disabled = true;
    saveBtn.textContent = qeLang === 'en' ? 'Saving…' : 'Lagrer…';
    setStatus('');

    var md = qeEditor.storage.markdown.getMarkdown();
    Object.keys(qeImageMap).forEach(function(dataUrl) { md = md.split(dataUrl).join(qeImageMap[dataUrl]); });
    var body = md.trim();

    // Bygg frontmatter fra skjemafeltene
    var fm = qeFrontmatter;
    var newTitle     = document.getElementById('qe-field-title').value.trim();
    var newLinkTitle = document.getElementById('qe-field-linktitle').value.trim();
    var newWeight    = document.getElementById('qe-field-weight').value.trim();
    var newStatus    = document.getElementById('qe-field-status').value;
    if (newTitle)     fm = setFmField(fm, 'title',     'title: '     + qeYamlStr(newTitle));
    if (newLinkTitle) fm = setFmField(fm, 'linkTitle', 'linkTitle: ' + qeYamlStr(newLinkTitle));
    else              fm = removeFmField(fm, 'linkTitle');
    if (newWeight)    fm = setFmField(fm, 'weight', 'weight: ' + parseInt(newWeight, 10));
    else              fm = removeFmField(fm, 'weight');
    if (newStatus)    fm = setFmField(fm, 'status', 'status: ' + newStatus);
    else              fm = removeFmField(fm, 'status');
    if (!document.getElementById('qe-field-hidetoc').checked) fm = setFmField(fm, 'hide_toc', 'hide_toc: true');
    else              fm = removeFmField(fm, 'hide_toc');
    if (document.getElementById('qe-field-draft').checked) fm = setFmField(fm, 'draft', 'draft: true');
    else              fm = removeFmField(fm, 'draft');
    var newContent = fm + body + '\n';
    var imgDir     = qeFilePath.replace('/_index.' + qeLang + '.md', '');
    var startTime  = Date.now();
    var commitMsg  = (qeLang === 'en' ? 'Updated: ' : 'Oppdatert: ') + qePageTitle;

    // Hent ETag for nåværende side async (best-effort) – brukes til å detektere deploy
    var qeOldEtag = null;
    fetch(qePermalink, { method: 'HEAD', cache: 'no-store' })
      .then(function(r) { qeOldEtag = r.headers.get('etag') || r.headers.get('last-modified') || null; })
      .catch(function() {});

    function onSaveSuccess() {
      setStatus(qeLang === 'en' ? 'Saved! Updating site…' : 'Lagret! Nettstedet oppdateres…');
      saveBtn.disabled = true;
      saveBtn.textContent = qeLang === 'en' ? 'Saved' : 'Lagret';
      saveBtn.style.background = '#888';
      saveBtn.style.cursor = 'default';
      var cancelBtn = document.getElementById('qe-cancel-btn');
      if (cancelBtn) {
        cancelBtn.textContent = qeLang === 'en' ? 'Close this window' : 'Lukk dette vinduet';
      }
      var w = document.getElementById('qe-build-warning');
      if (w) w.style.display = 'none';
      var _isModuleRepo = (qeRepo !== 'samt-bu-docs');
      samtbuIncrementPending();
      if (_isModuleRepo) {
        var _mp = samtbuGetPending();
        if (_mp) { _mp.moduleRepo = true; try { localStorage.setItem(SAMTBU_PENDING_KEY, JSON.stringify(_mp)); } catch(e) {} }
      }
      pollQeBuild(startTime, qeOldEtag, _isModuleRepo);
    }

    function onPrSuccess(pr) {
      var statusEl = document.getElementById('qe-status-text');
      if (statusEl) statusEl.innerHTML = (qeLang === 'en' ? '\u2713 Pull request: ' : '\u2713 Pull request: ') +
        (pr && pr.html_url ? '<a href="' + pr.html_url + '" target="_blank" style="color:#fff; text-decoration:underline;">#' + pr.number + '</a>' : '');
      saveBtn.disabled = true;
      saveBtn.textContent = qeLang === 'en' ? 'Sent' : 'Sendt';
      saveBtn.style.background = '#2d7a3a';
      saveBtn.style.cursor = 'default';
      var cancelBtn = document.getElementById('qe-cancel-btn');
      if (cancelBtn) cancelBtn.textContent = qeLang === 'en' ? 'Close' : 'Lukk';
    }

    function tryCommit(blobItems, deadline) {
      return createQeCommit(token, qeRepo, qeFilePath, newContent, blobItems, commitMsg)
        .catch(function(err) {
          if (err.message === 'Update is not a fast forward' && Date.now() < deadline) {
            if (overlay.style.display !== 'none') setStatus(qeLang === 'en' ? 'Retrying…' : 'Prøver på nytt…');
            return new Promise(function(res) { setTimeout(res, 2000); })
              .then(function() { return tryCommit(blobItems, deadline); });
          }
          throw err;
        });
    }

    checkCollaboratorPermission(qeRepo, function(canWrite) {
      var uploadPromise = canWrite
        ? uploadQeBlobs(token, qeRepo, imgDir, qeImages)
        : Promise.resolve([]);
      uploadPromise
        .then(function(blobItems) {
          if (canWrite) {
            return tryCommit(blobItems, Date.now() + 120000).then(onSaveSuccess);
          } else {
            var branchName = makePrBranch();
            var cleanTitle = (typeof qePageTitle === 'string') ? qePageTitle.replace(/^"(.*)"$/, '$1') : qePageTitle;
            var prTitle = (qeLang === 'en' ? 'Suggest change: ' : 'Foreslår endring: ') + cleanTitle;
            var qeLogin = localStorage.getItem('samt-bu-gh-user') || 'unknown';
            var prBody = qeLang === 'en'
              ? 'Suggested by @' + qeLogin + ' via SAMT-BU Docs editor.'
              : 'Foreslått av @' + qeLogin + ' via SAMT-BU Docs redigeringsgrensesnitt.';
            var items = [{path: qeFilePath, mode: '100644', type: 'blob', content: newContent}];
            return suggestViaWorker(qeRepo, branchName, items, null, commitMsg, prTitle, prBody)
              .then(onPrSuccess);
          }
        })
        .catch(function(err) {
          if (overlay.style.display !== 'none') {
            saveBtn.disabled = false;
            saveBtn.style.background = '';
            saveBtn.style.cursor = '';
            saveBtn.textContent = qeLang === 'en' ? 'Retry' : 'Prøv igjen';
            var msg = err.message;
            if (msg === 'Update is not a fast forward') {
              msg = qeLang === 'en'
                ? 'Conflict: page was changed by others. Try again.'
                : 'Konflikt: siden ble endret av andre. Prøv igjen.';
            }
            setStatus('⚠ ' + msg);
          }
        });
    });
  });

  function pollQeBuild(startTime, oldEtag, isModuleRepo) {
    if (qePollTimer) { clearInterval(qePollTimer); qePollTimer = null; }
    var lang = qeLang;
    var url = qePermalink;
    var attempts = 0;

    function doNav() { window.location.href = url + '?_=' + Date.now(); }

    function onBuildDone() {
      clearInterval(qePollTimer); qePollTimer = null;
      if (overlay.style.display !== 'none') {
        // Dialog er åpen: 3s gir fanfare (1.35s) + tale (starter 1.5s) tid til å spille
        var secs = 3;
        setStatus(lang === 'en' ? '✓ Done! Reloading in ' + secs + 's…' : '✓ Ferdig! Laster inn om ' + secs + ' sek…');
        var btn = document.getElementById('qe-save-btn');
        if (btn) {
          btn.disabled = false;
          btn.style.background = '';
          btn.style.cursor = '';
          btn.textContent = lang === 'en' ? 'Reload now ↗' : 'Last inn nå ↗';
          btn.onclick = function() { clearTimeout(navTimer); doNav(); };
        }
        var navTimer = setTimeout(doNav, secs * 1000);
      } else {
        // Dialog er lukket: forsinkelse slik at fanfare rekker å spille
        setTimeout(doNav, 1600);
      }
    }

    if (oldEtag) {
      samtbuPlayStart();
      // ETag-deteksjon: vent til Cloudflare serverer ny versjon (same-origin HEAD-poll)
      var _checkingApi = false;
      qePollTimer = setInterval(function() {
        if (++attempts > 180) {
          if (_checkingApi) return; // Unngå parallelle API-kall
          _checkingApi = true;
          // Sjekk faktisk byggestatus – rapporter kun feil hvis GitHub bekrefter det
          var _tok = getStoredToken();
          var _h = { 'Accept': 'application/vnd.github+json' };
          if (_tok) _h['Authorization'] = 'token ' + _tok;
          fetch('https://api.github.com/repos/SAMT-X/samt-bu-docs/actions/workflows/hugo.yml/runs?per_page=5', { headers: _h })
            .then(function(r) { return r.json(); })
            .then(function(data) {
              _checkingApi = false;
              var run = null;
              if (data.workflow_runs) {
                for (var i = 0; i < data.workflow_runs.length; i++) {
                  if (new Date(data.workflow_runs[i].created_at).getTime() >= startTime - 30000) {
                    run = data.workflow_runs[i]; break;
                  }
                }
              }
              if (!run) { clearInterval(qePollTimer); qePollTimer = null; samtbuPlayFailure(); setStatus('⚠ Tidsavbrudd'); return; }
              if (run.status === 'in_progress' || run.status === 'queued') {
                attempts = 0; // Bygg pågår – nullstill teller og fortsett ETag-poll
              } else if (run.status === 'completed' && run.conclusion === 'success') {
                clearInterval(qePollTimer); qePollTimer = null; samtbuPlaySuccess(); onBuildDone();
              } else if (run.status === 'completed' && run.conclusion === 'cancelled') {
                attempts = 0; setStatus(lang === 'en' ? 'Cancelled – waiting for new build…' : 'Avbrutt – venter på nytt bygg…');
              } else {
                clearInterval(qePollTimer); qePollTimer = null; samtbuPlayFailure(); setStatus('⚠ ' + (run.conclusion || 'Tidsavbrudd'));
              }
            })
            .catch(function() { _checkingApi = false; clearInterval(qePollTimer); qePollTimer = null; samtbuPlayFailure(); setStatus('⚠ Tidsavbrudd'); });
          return;
        }
        fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + '_cf=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
          .then(function(r) {
            var newEtag = r.headers.get('etag') || r.headers.get('last-modified');
            if (r.ok && newEtag && newEtag !== oldEtag) {
              if (!isModuleRepo) { samtbuPlaySuccess(); onBuildDone(); return; }
              // Modul-repo-redigering: ETag kan ha endret seg fra en annen jobb. Verifiser
              // at en repository_dispatch-kjøring faktisk er ferdig før vi erklærer done.
              oldEtag = newEtag; // oppdater slik at neste poll ikke re-trigger sjekken
              var _h2 = { 'Accept': 'application/vnd.github+json' };
              var _tok2 = getStoredToken(); if (_tok2) _h2['Authorization'] = 'token ' + _tok2;
              fetch('https://api.github.com/repos/SAMT-X/samt-bu-docs/actions/workflows/hugo.yml/runs?per_page=5&event=repository_dispatch', { headers: _h2, cache: 'no-store' })
                .then(function(r2) { return r2.json(); })
                .then(function(d2) {
                  var ok = false;
                  if (d2.workflow_runs) {
                    for (var j = 0; j < d2.workflow_runs.length; j++) {
                      var dr = d2.workflow_runs[j];
                      if (new Date(dr.created_at).getTime() >= startTime - 30000 && dr.status === 'completed' && dr.conclusion === 'success') { ok = true; break; }
                    }
                  }
                  if (ok) { samtbuPlaySuccess(); onBuildDone(); }
                  // else: fortsett polling – neste ETag-endring er trolig vår dispatch-jobb
                })
                .catch(function() { samtbuPlaySuccess(); onBuildDone(); }); // fail-safe: gå videre ved API-feil
            } else setStatus(lang === 'en' ? 'Updating site (' + attempts + 's)…' : 'Nettsted oppdateres (' + attempts + ' sek)…');
          })
          .catch(function() { setStatus('Venter…'); });
      }, 1000);
    } else {
      // Fallback: GitHub Actions API (2s intervall)
      qePollTimer = startGhPoll(startTime,
        onBuildDone,
        function onError(reason) { clearInterval(qePollTimer); qePollTimer = null; setStatus('⚠ ' + reason); },
        function onStatus(msg) { setStatus(msg); }
      );
    }
  }

  function uploadQeBlobs(token, repo, dirPath, images) {
    var names = Object.keys(images);
    if (!names.length) return Promise.resolve([]);
    var apiBase = 'https://api.github.com/repos/SAMT-X/' + repo;
    var h = { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
    return Promise.all(names.map(function(fname) {
      return fetch(apiBase + '/git/blobs', { method: 'POST', headers: h, body: JSON.stringify({ content: images[fname], encoding: 'base64' }) })
        .then(function(r) { return r.json(); })
        .then(function(blob) { return { path: dirPath + '/' + fname, mode: '100644', type: 'blob', sha: blob.sha }; });
    }));
  }

  function createQeCommit(token, repo, filePath, content, blobItems, message, targetBranch, org) {
    var apiBase = 'https://api.github.com/repos/' + (org || 'SAMT-X') + '/' + repo;
    var h = { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
    var headSha;
    var branch = targetBranch || 'main';
    return fetch(apiBase + '/git/ref/heads/main', { headers: h, cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(ref) {
        headSha = ref.object.sha;
        if (targetBranch) {
          return fetch(apiBase + '/git/refs', { method: 'POST', headers: h, body: JSON.stringify({ ref: 'refs/heads/' + targetBranch, sha: headSha }) })
            .then(function(r) { if (!r.ok) return r.json().then(function(j) { throw new Error(j.message || r.statusText); }); })
            .then(function() { return fetch(apiBase + '/git/commits/' + headSha, { headers: h, cache: 'no-store' }); });
        }
        return fetch(apiBase + '/git/commits/' + headSha, { headers: h, cache: 'no-store' });
      })
      .then(function(r) { return r.json(); })
      .then(function(commit) {
        var items = [{ path: filePath, mode: '100644', type: 'blob', content: content }].concat(blobItems || []);
        return fetch(apiBase + '/git/trees', { method: 'POST', headers: h, body: JSON.stringify({ base_tree: commit.tree.sha, tree: items }) });
      })
      .then(function(r) { return r.json(); })
      .then(function(tree) { return fetch(apiBase + '/git/commits', { method: 'POST', headers: h, body: JSON.stringify({ message: message, tree: tree.sha, parents: [headSha] }) }); })
      .then(function(r) { return r.json(); })
      .then(function(commit) { return fetch(apiBase + '/git/refs/heads/' + branch, { method: 'PATCH', headers: h, body: JSON.stringify({ sha: commit.sha }) }); })
      .then(function(r) {
        if (!r.ok) return r.json().then(function(j) { throw new Error(j.message || r.statusText); });
        return r.json();
      });
  }
})();
</script>

<!-- Bakgrunnspolling: detekter endringer på gjeldende side (andre brukere eller annet bygg) -->
<script>
(function() {
  var pageUrl = window.location.href.split('?')[0];
  var knownEtag = null;
  var bgTimer = null;
  var bgExternalRun = null; // ID på eksternt bygg vi følger
  var bgFastTimer = null;   // Rask ETag-poll (5s) mens eksternt bygg pågår

  // Stopp rask poll og fjern ekstern-indikator
  function stopBgFastPoll() {
    if (bgFastTimer) { clearInterval(bgFastTimer); bgFastTimer = null; }
    bgExternalRun = null;
    samtbuHideExternalBuildIndicator();
  }

  // Start rask ETag-poll (5s) for å oppdage at eksternt bygg er ferdig
  function startBgFastPoll() {
    if (bgFastTimer) return; // allerede aktiv
    bgFastTimer = setInterval(function() {
      var qeInd = document.getElementById('qe-job-indicator');
      if (qeInd && qeInd.dataset.building) { stopBgFastPoll(); return; } // eget bygg startet
      fetch(pageUrl + '?_bgf=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
        .then(function(r) {
          var newEtag = r.headers.get('etag') || r.headers.get('last-modified');
          if (newEtag && knownEtag && newEtag !== knownEtag) {
            knownEtag = newEtag;
            stopBgFastPoll();
            clearInterval(bgTimer);
            window.location.href = pageUrl + '?_=' + Date.now(); // auto-last inn
          }
        })
        .catch(function() {});
    }, 5000);
  }

  // Sjekk GitHub Actions API for aktive bygg som ikke er egne (krever innlogget bruker)
  function checkExternalBuilds() {
    var p = samtbuGetPending();
    if (p && p.count) { stopBgFastPoll(); return; } // eget bygg pågår – ikke interferér
    var token = getStoredToken();
    if (!token) { stopBgFastPoll(); return; } // ikke innlogget – kan ikke sjekke API
    var h = { 'Accept': 'application/vnd.github+json', 'Authorization': 'token ' + token };
    fetch('https://api.github.com/repos/SAMT-X/samt-bu-docs/actions/workflows/hugo.yml/runs?per_page=3', { headers: h })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.workflow_runs) return;
        var activeRun = null;
        for (var i = 0; i < data.workflow_runs.length; i++) {
          var run = data.workflow_runs[i];
          if (run.status === 'in_progress' || run.status === 'queued') { activeRun = run; break; }
        }
        if (activeRun) {
          bgExternalRun = activeRun.id;
          samtbuShowExternalBuildIndicator();
          startBgFastPoll();
        } else {
          stopBgFastPoll();
        }
      })
      .catch(function() {});
  }

  // Hent initial ETag etter at siden er ferdig lastet
  setTimeout(function() {
    fetch(pageUrl, { method: 'HEAD', cache: 'no-store' })
      .then(function(r) { knownEtag = r.headers.get('etag') || r.headers.get('last-modified'); })
      .catch(function() {});
  }, 4000);

  bgTimer = setInterval(function() {
    if (!knownEtag) return;
    // Ikke poll under aktiv rediger/slett-jobb (sjekk synlige indikatorer)
    var qeInd = document.getElementById('qe-job-indicator');
    if (qeInd && qeInd.dataset.building) return;

    fetch(pageUrl + '?_bg=' + Date.now(), { method: 'HEAD', cache: 'no-store' })
      .then(function(r) {
        var newEtag = r.headers.get('etag') || r.headers.get('last-modified');
        if (newEtag && newEtag !== knownEtag) {
          var p = samtbuGetPending();
          var tooSoon = p && p.count && p.lastSaveAt && (Date.now() - p.lastSaveAt) < 60000;
          if (tooSoon) { checkExternalBuilds(); return; } // for tidlig – sjekk likevel
          knownEtag = newEtag;
          clearInterval(bgTimer);
          if (p && p.count) {
            // Egne ventende endringer – last inn, men ikke hvis en dialog er åpen
            if (!samtbuHasVisibleDialog()) {
              window.location.href = window.location.href.split('?')[0] + '?_=' + Date.now();
            } else {
              var banner = document.getElementById('page-update-banner');
              if (banner) banner.style.display = 'flex';
            }
          } else if (bgExternalRun) {
            // Eksternt bygg er ferdig – auto-last inn, men ikke hvis en dialog er åpen
            stopBgFastPoll();
            if (!samtbuHasVisibleDialog()) {
              window.location.href = pageUrl + '?_=' + Date.now();
            } else {
              var banner = document.getElementById('page-update-banner');
              if (banner) banner.style.display = 'flex';
            }
          } else {
            // Ukjent endring – vis oppdateringsbanner
            var banner = document.getElementById('page-update-banner');
            if (banner) banner.style.display = 'flex';
          }
          return;
        }
        // ETag uendret – sjekk for aktive eksterne bygg
        checkExternalBuilds();
      })
      .catch(function() {});
  }, 45000);

  // Klikk på banneret laster inn siden på nytt
  setTimeout(function() {
    var banner = document.getElementById('page-update-banner');
    if (banner) banner.addEventListener('click', function() { window.location.reload(); });
  }, 1000);
})();

</script>

<!-- Gi kommentar: flytende WYSIWYG-dialog via GitHub Issues -->
<script>
(function() {
  var overlay = document.getElementById('cm-overlay');
  if (!overlay) return;

  var cmRepo = '', cmLang = 'nb', cmPageTitle = '', cmPermalink = '', cmPageId = '';
  var cmEditor = null;
  var cmImages = {}, cmImageMap = {};

  function setStatus(text) {
    var el = document.getElementById('cm-status-text');
    if (el) el.textContent = text;
  }

  function initCmEditor(callback) {
    if (cmEditor) {
      cmEditor.commands.setContent('');
      cmImages = {}; cmImageMap = {};
      callback(); return;
    }
    loadTiptap(function() {
      var T = window._Tiptap;
      cmEditor = new T.Editor({
        element: document.getElementById('cm-body-pm'),
        extensions: [
          T.StarterKit,
          T.Link.configure({ openOnClick: false }),
          T.Image,
          T.Markdown.configure({ html: false, transformPastedText: true })
        ],
        content: ''
      });
      setupCmToolbar(cmEditor);
      cmEditor.view.dom.addEventListener('paste', function(e) {
        var items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        for (var i = 0; i < items.length; i++) {
          if (items[i].type.indexOf('image') !== -1) {
            e.preventDefault();
            (function(item) {
              var ext = item.type === 'image/jpeg' ? 'jpg' : 'png';
              var fname = 'kommentar-' + Date.now() + '.' + ext;
              var reader = new FileReader();
              reader.onload = function(evt) {
                var dataUrl = evt.target.result;
                cmImages[fname] = dataUrl.split(',')[1];
                cmImageMap[dataUrl] = fname;
                cmEditor.chain().focus().setImage({ src: dataUrl }).run();
              };
              reader.readAsDataURL(item.getAsFile());
            })(items[i]);
            break;
          }
        }
      }, true);
      callback();
    });
  }

  function setupCmToolbar(editor) {
    var toolbar = document.getElementById('cm-toolbar');
    if (!toolbar) return;
    toolbar.addEventListener('click', function(e) {
      var btn = e.target.closest('[data-cm]');
      if (!btn) return;
      e.preventDefault();
      var cmd = btn.getAttribute('data-cm');
      switch (cmd) {
        case 'bold':   editor.chain().focus().toggleBold().run(); break;
        case 'italic': editor.chain().focus().toggleItalic().run(); break;
        case 'h2':     editor.chain().focus().toggleHeading({ level: 2 }).run(); break;
        case 'h3':     editor.chain().focus().toggleHeading({ level: 3 }).run(); break;
        case 'ul':     editor.chain().focus().toggleBulletList().run(); break;
        case 'ol':     editor.chain().focus().toggleOrderedList().run(); break;
        case 'link':
          var url = window.prompt('URL:');
          if (url) editor.chain().focus().setLink({ href: url }).run();
          else if (editor.isActive('link')) editor.chain().focus().unsetLink().run();
          break;
      }
      updateCmToolbarState(editor);
    });
    editor.on('selectionUpdate', function() { updateCmToolbarState(editor); });
    editor.on('transaction',     function() { updateCmToolbarState(editor); });
  }

  function updateCmToolbarState(editor) {
    var tb = document.getElementById('cm-toolbar');
    if (!tb) return;
    tb.querySelectorAll('[data-cm]').forEach(function(btn) {
      var cmd = btn.getAttribute('data-cm');
      var active = false;
      if      (cmd === 'bold')   active = editor.isActive('bold');
      else if (cmd === 'italic') active = editor.isActive('italic');
      else if (cmd === 'h2')     active = editor.isActive('heading', { level: 2 });
      else if (cmd === 'h3')     active = editor.isActive('heading', { level: 3 });
      else if (cmd === 'ul')     active = editor.isActive('bulletList');
      else if (cmd === 'ol')     active = editor.isActive('orderedList');
      else if (cmd === 'link')   active = editor.isActive('link');
      btn.classList.toggle('is-active', active);
    });
  }

  function closeDialog() {
    presenceClose();
    overlay.style.display = 'none';
    if (cmEditor) cmEditor.commands.setContent('');
    cmImages = {}; cmImageMap = {};
    document.getElementById('cm-title').value = '';
    document.getElementById('cm-section').value = '';
    document.getElementById('cm-error').style.display = 'none';
    document.getElementById('cm-form-section').style.display = 'flex';
    document.getElementById('cm-done-section').style.display = 'none';
    setStatus('');
    var btn = document.getElementById('cm-submit');
    btn.disabled = false;
    btn.textContent = 'Send';
    btn.style.background = '';
  }

  window.openCommentDialog = function(repo, lang, pageTitle, permalink, pageId) {
    cmRepo = repo;
    cmLang = lang || 'nb';
    cmPageTitle = pageTitle || '';
    cmPermalink = permalink || '';
    cmPageId = pageId || '';

    if (!getStoredToken()) {
      doGitHubLogin(function() {
        window.openCommentDialog(repo, lang, pageTitle, permalink, pageId);
      });
      return;
    }

    var isEn = cmLang === 'en';
    document.getElementById('cm-heading').textContent = isEn ? 'Give feedback' : 'Gi kommentar';
    document.getElementById('cm-cancel-btn').textContent = isEn ? 'Cancel' : 'Avbryt';
    document.getElementById('cm-submit').textContent = 'Send';
    document.getElementById('cm-submit').disabled = false;
    document.getElementById('cm-submit').style.background = '';
    document.getElementById('cm-form-section').style.display = 'flex';
    document.getElementById('cm-done-section').style.display = 'none';
    document.getElementById('cm-error').style.display = 'none';
    setStatus('');

    document.getElementById('cm-title-label').textContent = isEn ? 'Title' : 'Tittel';
    document.getElementById('cm-title').value = isEn
      ? 'Docs comment: ' + cmPageTitle
      : 'Kommentar til: ' + cmPageTitle;
    document.getElementById('cm-section-label').textContent = isEn
      ? 'Specific section (optional)'
      : 'Spesifikk del av siden (valgfritt)';
    document.getElementById('cm-section').placeholder = isEn
      ? 'e.g. https://\u2026#heading'
      : 'f.eks. https://\u2026#overskrift';
    document.getElementById('cm-section').value = window.location.hash ? window.location.href : '';

    overlay.style.display = 'flex';
    window._applyDialogPos && window._applyDialogPos('cm-overlay');
    fetchCurrentUser(function() { presenceOpen('cm', permalink); });
    initCmEditor(function() {
      cmEditor.on('update', function() { presenceMarkDirty(); });
      var _r = window._dlgRestoring;
      if (_r && _r.type === 'cm') {
        delete window._dlgRestoring;
        if (cmEditor && _r.content) cmEditor.commands.setContent(_r.content);
        var ctEl = document.getElementById('cm-title');
        if (ctEl && _r.title !== undefined) ctEl.value = _r.title;
        var csEl = document.getElementById('cm-section');
        if (csEl && _r.section !== undefined) csEl.value = _r.section;
        if (cmEditor) cmEditor.commands.focus();
      } else {
        setTimeout(function() { if (cmEditor) cmEditor.commands.focus(); }, 50);
      }
    });
    document.getElementById('cm-title').addEventListener('input', function() { presenceMarkDirty(); }, { once: true });
  };

  document.getElementById('cm-cancel-btn').addEventListener('click', closeDialog);
  overlay.addEventListener('keydown', function(e) { if (e.key === 'Escape') closeDialog(); e.stopPropagation(); });

  window._dlgSaveCm = function() {
    var el = document.getElementById('cm-overlay');
    if (!el || el.style.display === 'none' || !cmEditor) return null;
    return { type:'cm', repo:cmRepo, lang:cmLang,
      pageTitle:cmPageTitle, permalink:cmPermalink, pageId:cmPageId,
      title:(document.getElementById('cm-title')||{}).value||'',
      section:(document.getElementById('cm-section')||{}).value||'',
      content:cmEditor.getJSON() };
  };

  function uploadCmImages(token, images) {
    var names = Object.keys(images);
    if (!names.length) return Promise.resolve({});
    var h = { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
    var resolvedUrls = {};
    return Promise.all(names.map(function(fname) {
      return fetch('https://api.github.com/repos/SAMT-X/samt-bu-docs/contents/static/uploads/comments/' + fname, {
        method: 'PUT', headers: h,
        body: JSON.stringify({ message: 'Legg til vedlegg: ' + fname, content: images[fname] })
      })
      .then(function(r) { return r.json(); })
      .then(function() {
        resolvedUrls[fname] = 'https://raw.githubusercontent.com/SAMT-X/samt-bu-docs/main/static/uploads/comments/' + fname;
      })
      .catch(function() {}); // fortsett selv om bildeopplasting feiler
    })).then(function() { return resolvedUrls; });
  }

  document.getElementById('cm-submit').addEventListener('click', function() {
    if (!cmEditor) return;
    var text = cmEditor.storage.markdown.getMarkdown().trim();
    var isEn = cmLang === 'en';
    var errorEl = document.getElementById('cm-error');
    if (!text) {
      errorEl.textContent = isEn ? 'Please enter a comment.' : 'Skriv inn en kommentar.';
      errorEl.style.display = 'block';
      return;
    }
    var token = getStoredToken();
    if (!token) { closeDialog(); return; }

    var btn = document.getElementById('cm-submit');
    btn.disabled = true;
    btn.textContent = isEn ? 'Sending\u2026' : 'Sender\u2026';
    errorEl.style.display = 'none';
    setStatus(isEn ? 'Uploading\u2026' : 'Laster opp\u2026');

    uploadCmImages(token, cmImages).then(function(resolvedUrls) {
      // Erstatt data-URLer med raw GitHub-URLer i Markdown
      Object.keys(cmImageMap).forEach(function(dataUrl) {
        var fname = cmImageMap[dataUrl];
        var rawUrl = resolvedUrls[fname];
        if (rawUrl) text = text.split(dataUrl).join(rawUrl);
      });

      setStatus('');
      var issueTitle = document.getElementById('cm-title').value.trim()
        || (isEn ? 'Docs comment: ' + cmPageTitle : 'Kommentar til: ' + cmPageTitle);
      var pageUrl = window.location.origin + cmPermalink;
      var sectionUrl = document.getElementById('cm-section').value.trim();
      var metaLines = [(isEn ? '**Page:** ' : '**Side:** ') + '[' + cmPageTitle + '](' + pageUrl + ')'];
      if (cmPageId) metaLines.push('**ID:** `' + cmPageId + '`');
      if (sectionUrl) metaLines.push((isEn ? '**Section:** ' : '**Seksjon:** ') + sectionUrl);
      var issueBody = metaLines.join('\n') + '\n\n---\n\n' + text;

      return fetch('https://api.github.com/repos/SAMT-X/' + cmRepo + '/issues', {
        method: 'POST',
        headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: issueTitle, body: issueBody })
      });
    })
    .then(function(r) {
      if (!r.ok) return r.json().then(function(d) { throw new Error(d.message || r.status); });
      return r.json();
    })
    .then(function(issue) {
      document.getElementById('cm-form-section').style.display = 'none';
      document.getElementById('cm-done-section').style.display = 'flex';
      document.getElementById('cm-done-text').textContent = isEn
        ? '\u2705 Your comment has been registered.'
        : '\u2705 Kommentaren din er registrert.';
      var link = document.getElementById('cm-issue-link');
      link.href = issue.html_url;
      link.textContent = isEn ? 'View issue on GitHub \u2192' : 'Se issue p\u00e5 GitHub \u2192';
      btn.textContent = isEn ? 'Close' : 'Lukk';
      btn.disabled = false;
      btn.style.background = '#888';
      btn.onclick = closeDialog;
      document.getElementById('cm-cancel-btn').textContent = isEn ? 'Close window' : 'Lukk vinduet';
    })
    .catch(function(err) {
      btn.disabled = false;
      btn.textContent = 'Send';
      setStatus('');
      errorEl.textContent = (isEn ? 'Something went wrong: ' : 'Noe gikk galt: ') + err.message;
      errorEl.style.display = 'block';
    });
  });
})();
</script>

<!-- Kommentar-issues: knapp og panel -->
<script>
(function() {
  var btn = document.getElementById('pg-issues-btn');
  var panel = document.getElementById('pg-issues-panel');
  var listEl = document.getElementById('pg-issues-list');
  if (!btn || !panel || !listEl) return;

  var repo = btn.dataset.repo || 'samt-bu-docs';
  var lang = btn.dataset.lang || 'nb';
  var isEn = lang === 'en';
  var permalink = btn.dataset.permalink || window.location.pathname;
  var pageUrl = window.location.origin + permalink;
  var fetched = false;
  var panelOpen = false;

  document.getElementById('pg-issues-heading').textContent =
    isEn ? 'Comments on this page' : 'Kommentarer til denne siden';
  document.getElementById('pg-issues-add-label').textContent =
    isEn ? 'Give feedback' : 'Gi kommentar';

  function openPanel() {
    if (window.samtbuCloseHistory) window.samtbuCloseHistory();
    panel.style.display = 'block';
    panelOpen = true;
    if (!fetched) fetchIssues();
  }
  function closePanel() {
    panel.style.display = 'none';
    panelOpen = false;
  }
  window.samtbuCloseIssuesPanel = closePanel;

  btn.addEventListener('click', function(e) {
    e.stopPropagation();
    if (panelOpen) closePanel(); else openPanel();
  });
  document.getElementById('pg-issues-close').addEventListener('click', closePanel);
  document.addEventListener('click', function(e) {
    if (!panelOpen) return;
    if (!panel.contains(e.target) && !btn.contains(e.target)) closePanel();
  });
  document.addEventListener('keydown', function(e) {
    if (e.key === 'Escape' && panelOpen) closePanel();
  });

  document.getElementById('pg-issues-add-link').addEventListener('click', function(e) {
    e.preventDefault();
    closePanel();
    if (window.openCommentDialog) {
      window.openCommentDialog(repo, lang, btn.dataset.title || '', permalink, btn.dataset.pageId || '');
    }
  });

  function fetchIssues() {
    listEl.innerHTML = '<div style="padding:12px 14px; color:#999;">'
      + (isEn ? 'Loading\u2026' : 'Laster\u2026') + '</div>';

    var q = 'repo:SAMT-X/' + repo + ' in:body "' + pageUrl + '" is:issue';
    var apiUrl = 'https://api.github.com/search/issues?q='
      + encodeURIComponent(q) + '&per_page=20&sort=created&order=desc';

    var headers = { 'Accept': 'application/vnd.github+json' };
    var token = (typeof getStoredToken === 'function') ? getStoredToken() : null;
    if (token) headers['Authorization'] = 'token ' + token;

    fetch(apiUrl, { headers: headers })
      .then(function(r) {
        if (!r.ok) throw new Error(r.status);
        return r.json();
      })
      .then(function(data) {
        fetched = true;
        var issues = data.items || [];
        var n = data.total_count || 0;

        var labelEl = document.getElementById('pg-issues-label');
        if (labelEl) labelEl.textContent = n === 0
          ? (isEn ? 'No comments' : 'Ingen kommentarer')
          : (n === 1
            ? (isEn ? '1 comment' : '1 kommentar')
            : n + (isEn ? ' comments' : ' kommentarer'));

        if (issues.length === 0) {
          listEl.innerHTML = '<div style="padding:12px 14px; color:#888; font-style:italic;">'
            + (isEn ? 'No comments yet.' : 'Ingen kommentarer ennå.') + '</div>';
          return;
        }

        var html = '';
        issues.forEach(function(issue) {
          var d = new Date(issue.created_at);
          var dateStr = d.toLocaleDateString(isEn ? 'en-GB' : 'nb-NO',
            { day: 'numeric', month: 'short', year: 'numeric' });
          var isOpen = issue.state === 'open';
          var badgeBg = isOpen ? '#1a4a1a' : '#3a1a1a';
          var badgeText = isOpen
            ? (isEn ? 'open' : 'åpen')
            : (isEn ? 'closed' : 'lukket');
          html += '<div style="padding:9px 14px; border-bottom:1px solid rgba(255,255,255,.07);">'
            + '<div style="display:flex; align-items:flex-start; gap:8px;">'
            + '<a href="' + esc(issue.html_url) + '" target="_blank" rel="noopener"'
            + ' style="flex:1; color:#7ec8e3; text-decoration:none; font-size:13px; line-height:1.4;">'
            + esc(issue.title) + '</a>'
            + '<span style="flex-shrink:0; font-size:11px; padding:1px 7px; border-radius:10px;'
            + ' background:' + badgeBg + '; color:#cfc; white-space:nowrap;">' + badgeText + '</span>'
            + '</div>'
            + '<div style="margin-top:3px; font-size:11px; color:#666;">'
            + '#' + issue.number + ' \u00b7 ' + dateStr + ' \u00b7 ' + esc(issue.user.login)
            + '</div></div>';
        });
        listEl.innerHTML = html;
      })
      .catch(function() {
        listEl.innerHTML = '<div style="padding:12px 14px; color:#f88;">'
          + (isEn ? 'Could not load comments.' : 'Kunne ikke laste kommentarer.') + '</div>';
      });
  }

  function esc(str) {
    return String(str)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;');
  }
})();
</script>
