<!-- Delt GitHub-token-hjelper (global, brukes av alle redigeringsfunksjoner) -->
<script>
/* Migrering av lagringsnøkler: 'samtu-' -> 'samt-bu-'  (2026-08-01)

   Prefikset 'samtu-' var en skrivefeil for 'samt-bu-'. Nøklene ligger i
   brukernes egne nettlesere, så en ren omdøping ville gjort eksisterende
   verdier foreldreløse. Det er ikke bare kosmetisk: 'samtu-build-pending'
   holder byggejobber som er i gang, og 'samtu-move-state' en flytteoperasjon
   midt i. Vi flytter dem derfor over i stedet for å forlate dem.

   Må kjøre FØRST i denne filen – all annen kode leser nøklene lenger nede.
   Kan fjernes når alle brukere har lastet siden minst én gang etter 2026-08.  */
(function migrateSamtuKeys() {
  ['localStorage', 'sessionStorage'].forEach(function(store) {
    try {
      var s = window[store];
      var old = [];
      for (var i = 0; i < s.length; i++) {
        var k = s.key(i);
        if (k && k.indexOf('samtu-') === 0) old.push(k);
      }
      old.forEach(function(k) {
        var target = 'samt-bu-' + k.slice('samtu-'.length);
        try {
          // Ikke overskriv en nyere verdi som allerede finnes under nytt navn
          if (s.getItem(target) === null) s.setItem(target, s.getItem(k));
          s.removeItem(k);
        } catch(e) {}
      });
    } catch(e) {}
  });
})();

var SAMT_TOKEN_KEY = 'samt-bu-gh-token';

function getStoredToken() {
  try {
    var t = localStorage.getItem(SAMT_TOKEN_KEY);
    if (t) return t;
    // Migrasjons-fallback: les fra Decap-nøkler om de finnes
    var keys = ['netlify-cms-user', 'decap-cms-user'];
    for (var i = 0; i < keys.length; i++) {
      var val = localStorage.getItem(keys[i]);
      if (val) { var parsed = JSON.parse(val); if (parsed && parsed.token) return parsed.token; }
    }
  } catch(e) {}
  return null;
}

// Tøm rettighets-cachen for ALLE repoer. Skanner nøkler i stedet for å bruke en
// hardkodet repo-liste: tidligere ryddet koden et annet prefiks enn det nøklene
// faktisk ble skrevet med, så gjeldende cache ble aldri tømt ved utlogging.
// Skanning gjør at feilen ikke kan gjenoppstå når nøkkelnavn endres.
function samtbuClearPermCache() {
  try {
    var doomed = [];
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k && k.indexOf('samt-bu-perm') === 0) doomed.push(k);
    }
    doomed.forEach(function(k) { try { localStorage.removeItem(k); } catch(e2) {} });
  } catch(e) {}
}

function storeToken(token) {
  try {
    localStorage.setItem(SAMT_TOKEN_KEY, token);
    localStorage.removeItem('samt-bu-gh-user');
    localStorage.removeItem('samt-bu-gh-name');
    localStorage.removeItem('samt-bu-gh-avatar');
  } catch(e) {}
  samtbuClearPermCache();
  try { sessionStorage.removeItem('samt-bu-prs-v1'); } catch(e) {}
}

function doGitHubLogin(onSuccess, loginHint) {
  var workerBase = 'https://auth.samt-bu.no';
  var force = !loginHint && localStorage.getItem('samt-bu-force-login') === '1';
  try { if (force || loginHint) localStorage.removeItem('samt-bu-force-login'); } catch(e) {}
  var authUrl = workerBase + '/auth?provider=github&site_id=samt-bu-docs' +
    (loginHint ? '&login=' + encodeURIComponent(loginHint) : (force ? '&force=true' : ''));
  var w = 600, h = 700;
  var left = Math.round((screen.width - w) / 2);
  var top  = Math.round((screen.height - h) / 2);
  var popup = window.open(
    authUrl,
    'samt-gh-oauth',
    'width=' + w + ',height=' + h + ',left=' + left + ',top=' + top
  );
  if (!popup) {
    alert('Popup ble blokkert av nettleseren. Tillat popup-vinduer for dette nettstedet og prøv igjen.');
    return;
  }
  function handleMessage(e) {
    var data = e.data;
    if (data === 'authorizing:github') {
      // Decap-protokoll: svar til popup slik at den vet vår origin og kan sende token tilbake
      e.source.postMessage('authorizing:github', e.origin);
      return;
    }
    if (data === 'authorization:github:cancelled') {
      window.removeEventListener('message', handleMessage);
      if (popup && !popup.closed) popup.close();
      return;
    }
    if (typeof data === 'string' && data.indexOf('authorization:github:success:') === 0) {
      window.removeEventListener('message', handleMessage);
      try {
        var payload = JSON.parse(data.slice('authorization:github:success:'.length));
        if (payload.token) {
          storeToken(payload.token);
          if (popup && !popup.closed) popup.close();
          onSuccess(payload.token);
        }
      } catch(err) {
        alert('Innlogging feilet: ' + err.message);
      }
    }
  }
  window.addEventListener('message', handleMessage);
}

// Sjekk om eit bygg pågår akkurat nå – returnerer true/false via callback (best-effort)
function checkBuildInProgress(filePath, callback) {
  var token = getStoredToken();
  var h = { 'Accept': 'application/vnd.github+json' };
  if (token) h['Authorization'] = 'token ' + token;
  fetch('https://api.github.com/repos/SAMT-X/samt-bu-docs/actions/workflows/hugo.yml/runs?per_page=1', { headers: h })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var run = data.workflow_runs && data.workflow_runs[0];
      if (!run || (run.status !== 'in_progress' && run.status !== 'queued')) { callback(false); return; }
      var age = (Date.now() - new Date(run.created_at).getTime()) / 1000;
      if (age >= 600) { callback(false); return; }
      if (!filePath) { callback(true); return; }
      // Vis kun advarsel om commit som trigget bygget berørte samme fil
      fetch('https://api.github.com/repos/SAMT-X/samt-bu-docs/commits/' + run.head_sha, { headers: h })
        .then(function(r) { return r.json(); })
        .then(function(commit) {
          var files = (commit.files || []).map(function(f) { return f.filename; });
          callback(files.indexOf(filePath) !== -1);
        })
        .catch(function() { callback(true); }); // fail safe: vis advarsel
    })
    .catch(function() { callback(false); });
}

// --- Presence-system (tilstedeværelsessignaler i redigeringsdialogene) ---
// Sett PRESENCE_ENABLED = true etter at KV-namespace er konfigurert i Cloudflare
// og wrangler.toml er oppdatert og worker er deployet. Se cloudflare-worker/wrangler.toml.
var PRESENCE_ENABLED = false;

var _presencePage    = '';   // URL-sti for siden som er åpen i dialog
var _presenceDialog  = '';   // 'qe' | 'np' | 'cm'
var _presenceDirty   = false;
var _presenceHb      = null; // heartbeat interval
var _presencePoll    = null; // poll interval
var _presencePrev    = [];   // forrige andre-liste (for endringsdeteksjon)

function presenceOpen(dialogId, permalink) {
  _presencePage   = '';
  _presenceDialog = dialogId;
  _presenceDirty  = false;
  _presencePrev   = [];
  try { _presencePage = new URL(permalink || window.location.href).pathname; } catch(_) {}
  if (!PRESENCE_ENABLED || !_presencePage) return;
  _presencePost('open');
  _presencePollNow(dialogId);
  _presenceHb   = setInterval(function() { _presencePost(_presenceDirty ? 'dirty' : 'open'); }, 20000);
  _presencePoll = setInterval(function() { _presencePollNow(dialogId); }, 20000);
}

function presenceClose() {
  clearInterval(_presenceHb);
  clearInterval(_presencePoll);
  _presenceHb = _presencePoll = null;
  if (PRESENCE_ENABLED && _presencePage) _presenceDelete();
  _presencePage = _presenceDialog = '';
  _presenceDirty = false;
  _presencePrev  = [];
}

function presenceMarkDirty() {
  if (_presenceDirty) return;
  _presenceDirty = true;
  if (PRESENCE_ENABLED && _presencePage) _presencePost('dirty');
}

function _presencePost(state) {
  var token = getStoredToken();
  if (!token) return;
  var login = localStorage.getItem('samt-bu-gh-user') || '';
  var name  = localStorage.getItem('samt-bu-gh-name')  || login;
  if (!login) return;
  fetch('https://auth.samt-bu.no/presence', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'token ' + token },
    body: JSON.stringify({ page: _presencePage, user: name, login: login, state: state })
  }).catch(function() {});
}

function _presenceDelete() {
  var token = getStoredToken();
  if (!token) return;
  var login = localStorage.getItem('samt-bu-gh-user') || '';
  if (!login) return;
  fetch('https://auth.samt-bu.no/presence', {
    method: 'DELETE',
    headers: { 'Content-Type': 'application/json', 'Authorization': 'token ' + token },
    body: JSON.stringify({ page: _presencePage, login: login })
  }).catch(function() {});
}

function _presencePollNow(dialogId) {
  if (!PRESENCE_ENABLED || !_presencePage) return;
  var myLogin = localStorage.getItem('samt-bu-gh-user') || '';
  fetch('https://auth.samt-bu.no/presence?page=' + encodeURIComponent(_presencePage), { cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var others = (data.entries || []).filter(function(e) { return e.login !== myLogin; });
      _presenceUpdateBanner(dialogId, others);
      _presenceCheckToast(others);
      _presencePrev = others;
    })
    .catch(function() {});
}

function _presenceUpdateBanner(dialogId, others) {
  var el = document.getElementById(dialogId + '-presence-warning');
  if (!el) return;
  if (!others.length) { el.style.display = 'none'; el.innerHTML = ''; return; }
  var parts = others.map(function(e) {
    var who = '<strong>' + (e.user || e.login) + '</strong>';
    return e.state === 'dirty'
      ? (document.documentElement.lang === 'en' ? who + ' is editing this page' : who + ' redigerer denne siden')
      : (document.documentElement.lang === 'en' ? who + ' has this page open' : who + ' har denne siden åpen');
  });
  el.innerHTML = '&#9888; ' + parts.join(' &nbsp;·&nbsp; ');
  el.style.display = 'block';
}

function _presenceCheckToast(others) {
  var prev = _presencePrev;
  others.forEach(function(e) {
    var prevEntry = prev.filter(function(p) { return p.login === e.login; })[0];
    var isNew       = !prevEntry;
    var wentDirty   = prevEntry && prevEntry.state !== 'dirty' && e.state === 'dirty';
    var en = document.documentElement.lang === 'en';
    var who = e.user || e.login;
    if (isNew) {
      _presenceToast(en ? who + ' opened this page' : who + ' åpnet denne siden');
    } else if (wentDirty) {
      _presenceToast(en ? who + ' started editing' : who + ' begynte å redigere');
    }
  });
}

function _presenceToast(msg) {
  var toast = document.createElement('div');
  toast.textContent = msg;
  toast.style.cssText = 'position:fixed; bottom:24px; right:24px; z-index:999999; background:#37474f; color:#fff; padding:.55rem 1.1rem; border-radius:6px; font-size:.9rem; box-shadow:0 2px 10px rgba(0,0,0,.3); opacity:0; transition:opacity .25s;';
  document.body.appendChild(toast);
  requestAnimationFrame(function() { toast.style.opacity = '1'; });
  setTimeout(function() {
    toast.style.opacity = '0';
    setTimeout(function() { toast.remove(); }, 300);
  }, 4000);
}

/* Melding etter utlogging.

   Utlogging her fjerner bare tokenet vårt. GitHub-sesjonen i nettleseren
   består, og siden appen alt er godkjent, gir neste innlogging samme konto
   tilbake uten å spørre. Det ser ut som at utloggingen ikke virket.

   Vi kan ikke logge brukeren ut av github.com – det må gjøres der. Så vi sier
   det rett ut og gir lenken, i stedet for å late som ingenting. */
function samtbuLogoutNotice() {
  var en = !!(window._samtbuThisPage && window._samtbuThisPage.lang === 'en');
  var old = document.getElementById('samt-bu-logout-notice');
  if (old) old.remove();

  var box = document.createElement('div');
  box.id = 'samt-bu-logout-notice';
  box.style.cssText = 'position:fixed; bottom:44px; right:24px; z-index:999999;' +
    ' background:#fff; color:#222; border:1px solid #d0d8e8; border-left:4px solid #1a4a8a;' +
    ' padding:.85rem 1.1rem; border-radius:5px; font-size:14px; line-height:1.5;' +
    ' box-shadow:0 4px 18px rgba(0,0,0,.22); max-width:340px; font-family:inherit;';

  var p = document.createElement('p');
  p.style.cssText = 'margin:0 0 .7rem;';
  p.textContent = en
    ? 'Logged out of this site. You are still signed in to GitHub, so logging in again will use the same account.'
    : 'Du er logget ut av nettstedet. Du er fortsatt innlogget på GitHub, så neste innlogging bruker samme konto.';

  var row = document.createElement('div');
  row.style.cssText = 'display:flex; gap:.6rem; justify-content:flex-end; align-items:center;';

  var dismiss = document.createElement('button');
  dismiss.type = 'button';
  dismiss.textContent = en ? 'OK' : 'OK';
  dismiss.style.cssText = 'padding:.35rem 1rem; border:1px solid #ccc; border-radius:4px;' +
    ' background:#fff; cursor:pointer; font-size:13px; font-family:inherit;';
  dismiss.addEventListener('click', function() { box.remove(); });

  var out = document.createElement('a');
  out.href = 'https://github.com/logout';
  out.target = '_blank';
  out.rel = 'noopener';
  out.textContent = en ? 'Sign out of GitHub too' : 'Logg ut av GitHub også';
  out.style.cssText = 'padding:.35rem 1rem; border:none; border-radius:4px; background:#1a4a8a;' +
    ' color:#fff; cursor:pointer; font-size:13px; font-family:inherit; text-decoration:none;';

  row.appendChild(dismiss);
  row.appendChild(out);
  box.appendChild(p);
  box.appendChild(row);
  document.body.appendChild(box);

  setTimeout(function() {
    var el = document.getElementById('samt-bu-logout-notice');
    if (el) el.remove();
  }, 20000);
}

// Hent og cache innlogget GitHub-brukernavn
function fetchCurrentUser(callback) {
  var cached = localStorage.getItem('samt-bu-gh-user');
  if (cached && localStorage.getItem('samt-bu-gh-avatar')) { updateAvatarDisplay(); callback(cached); return; }
  var token = getStoredToken();
  if (!token) { callback(null); return; }
  fetch('https://api.github.com/user', {
    headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }
  })
    .then(function(r) { return r.json(); })
    .then(function(u) {
      var login  = u.login      || null;
      var name   = u.name       || null;
      var avatar = u.avatar_url || null;
      if (login)  { try { localStorage.setItem('samt-bu-gh-user',   login);  } catch(e) {} }
      if (name)   { try { localStorage.setItem('samt-bu-gh-name',   name);   } catch(e) {} }
      if (avatar) { try { localStorage.setItem('samt-bu-gh-avatar', avatar); } catch(e) {} }
      updateAvatarDisplay();
      callback(login);
    })
    .catch(function() { callback(null); });
}

function updateAvatarDisplay() {
  var img      = document.getElementById('samt-bu-user-avatar');
  var loginBtn = document.getElementById('samt-bu-login-btn');
  var label    = document.getElementById('samt-bu-avatar-username');
  var avatar   = localStorage.getItem('samt-bu-gh-avatar');
  var login    = localStorage.getItem('samt-bu-gh-user');
  if (avatar && login) {
    if (img)      { img.src = avatar; img.title = '@' + login; img.style.display = 'inline-block'; }
    if (label)    { label.textContent = '@' + login; }
    if (loginBtn) { loginBtn.style.display = 'none'; }
    samtbuUpdateMenuLabels();
  } else {
    if (img)      { img.style.display = 'none'; }
    if (loginBtn) { loginBtn.style.display = 'inline-block'; }
    samtbuResetMenuLabels();
  }
  // Admin-gruppen i Endre-menyen følger innloggingstilstanden
  if (typeof samtbuUpdateAdminMenu === 'function') samtbuUpdateAdminMenu();
}
function samtbuUpdateMenuLabels() {
  if (!window._samtbuThisPage) return;
  var lang = window._samtbuThisPage.lang;
  checkCollaboratorPermission(window._samtbuThisPage.repo, function(canWrite) {
    var editLabel = document.getElementById('samt-bu-edit-page-label');
    var moveLabel = document.getElementById('samt-bu-move-label');
    if (editLabel) editLabel.textContent = canWrite ? (lang === 'en' ? 'Edit this page' : 'Rediger denne siden') : (lang === 'en' ? 'Suggest edit to this page' : 'Foreslå endring av denne siden');
    if (moveLabel) moveLabel.textContent = canWrite ? (lang === 'en' ? 'Move this chapter' : 'Flytt dette kapitlet') : (lang === 'en' ? 'Suggest moving this chapter' : 'Foreslå flytting av kapittel');
  });
}
function samtbuResetMenuLabels() {
  var lang = window._samtbuThisPage ? window._samtbuThisPage.lang : 'nb';
  var editLabel = document.getElementById('samt-bu-edit-page-label');
  var moveLabel = document.getElementById('samt-bu-move-label');
  if (editLabel) editLabel.textContent = lang === 'en' ? 'Edit this page' : 'Rediger denne siden';
  if (moveLabel) moveLabel.textContent = lang === 'en' ? 'Move this chapter' : 'Flytt dette kapitlet';
}

function samtbuLogout() {
  try {
    localStorage.removeItem(SAMT_TOKEN_KEY);
    localStorage.removeItem('samt-bu-gh-user');
    localStorage.removeItem('samt-bu-gh-name');
    localStorage.removeItem('samt-bu-gh-avatar');
    localStorage.setItem('samt-bu-force-login', '1');
  } catch(e) {}
  samtbuClearPermCache();
  try { sessionStorage.removeItem('samt-bu-prs-v1'); } catch(e) {}
  updateAvatarDisplay();
}

function checkCollaboratorPermission(repo, callback) {
  var cacheKey = 'samt-bu-perm2-' + repo + '-' + (localStorage.getItem('samt-bu-gh-user') || ''); // v3: bruker-spesifikk nøkkel
  var ttl = 3600000; // 1 hour
  try {
    var cached = JSON.parse(localStorage.getItem(cacheKey));
    if (cached && (Date.now() - cached.ts) < ttl) { callback(cached.canWrite); return; }
  } catch(e) {}
  var token = getStoredToken();
  if (!token) { callback(false); return; }
  fetch('https://api.github.com/repos/SAMT-X/' + repo, {
    headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' }
  })
    .then(function(r) { return r.json(); })
    .then(function(data) {
      var canWrite = !!(data.permissions && (data.permissions.push || data.permissions.admin));
      try { localStorage.setItem(cacheKey, JSON.stringify({ canWrite: canWrite, ts: Date.now() })); } catch(e) {}
      callback(canWrite);
    })
    .catch(function() { callback(false); });
}

/* ---------------------------------------------------------------------------
   Plattformsøm mot GitHub (issue #60)

   Alle NYE kall mot forslagshåndtering går gjennom disse funksjonene. Målet er
   at en annen Git-vert senere kan legges inn som en alternativ implementasjon
   av samme fire operasjoner, uten å røre kallstedene. Eldre kall i denne filen
   snakker fortsatt direkte med api.github.com – de flyttes hit etter hvert.

   Operasjoner: samtbuPrList · samtbuPrMerge · samtbuPrClose · samtbuPrComment
--------------------------------------------------------------------------- */
var SAMTBU_ORG = 'SAMT-X';
var SAMTBU_REPOS = [
  'samt-bu-docs',
  'solution-samt-bu-docs',
  'team-architecture',
  'team-semantics',
  'samt-bu-drafts',
  'samt-bu-pilot-1',
  'samt-bu-pilot-2',
  'samt-bu-pilot-3',
  'samt-bu-pilot-4',
  'samt-bu-market-engagement'
];

// Lavnivå: ett kall mot GitHub-API-et. Kaster Error med GitHubs egen melding.
function samtbuGh(path, opts) {
  opts = opts || {};
  var headers = { 'Accept': 'application/vnd.github+json' };
  var token = getStoredToken();
  if (token) headers['Authorization'] = 'token ' + token;
  if (opts.body) headers['Content-Type'] = 'application/json';
  return fetch('https://api.github.com' + path, {
    method: opts.method || 'GET',
    headers: headers,
    cache: 'no-store',
    body: opts.body ? JSON.stringify(opts.body) : undefined
  }).then(function(r) {
    return r.json().catch(function() { return {}; }).then(function(json) {
      if (!r.ok) {
        var err = new Error(json.message || r.statusText || ('HTTP ' + r.status));
        err.status = r.status;
        throw err;
      }
      return json;
    });
  });
}

// Åpne forslag på tvers av alle repoer. Ett repo som feiler stopper ikke resten.
// Returnerer en flat liste sortert med nyeste først.
function samtbuPrList() {
  var jobs = SAMTBU_REPOS.map(function(repo) {
    return samtbuGh('/repos/' + SAMTBU_ORG + '/' + repo + '/pulls?state=open&per_page=30')
      .then(function(prs) {
        return (prs || []).map(function(pr) {
          return {
            repo: repo,
            number: pr.number,
            title: pr.title,
            author: (pr.user && pr.user.login) || '',
            authorUrl: (pr.user && pr.user.html_url) || '',
            createdAt: pr.created_at,
            updatedAt: pr.updated_at,
            url: pr.html_url,
            draft: !!pr.draft,
            branch: pr.head && pr.head.ref
          };
        });
      })
      .catch(function() { return []; });   // f.eks. 404 for repo brukeren ikke ser
  });
  return Promise.all(jobs).then(function(lists) {
    var all = [];
    lists.forEach(function(l) { all = all.concat(l); });
    all.sort(function(a, b) { return new Date(b.updatedAt) - new Date(a.updatedAt); });
    return all;
  });
}

// Slå sammen. merge_method 'merge' er bevisst: gir «Merged» (lilla) i GitHub,
// ikke «Closed» – som er forvirrende for ikke-tekniske bidragsytere.
function samtbuPrMerge(repo, number, commitTitle) {
  return samtbuGh('/repos/' + SAMTBU_ORG + '/' + repo + '/pulls/' + number + '/merge', {
    method: 'PUT',
    body: { merge_method: 'merge', commit_title: commitTitle || undefined }
  });
}

function samtbuPrClose(repo, number) {
  return samtbuGh('/repos/' + SAMTBU_ORG + '/' + repo + '/pulls/' + number, {
    method: 'PATCH',
    body: { state: 'closed' }
  });
}

// PR-er er issues i GitHubs datamodell – kommentarer går mot issues-endepunktet.
function samtbuPrComment(repo, number, body) {
  return samtbuGh('/repos/' + SAMTBU_ORG + '/' + repo + '/issues/' + number + '/comments', {
    method: 'POST',
    body: { body: body }
  });
}

// Promise-innpakning av den callback-baserte rettighetssjekken.
function samtbuCanWrite(repo) {
  return new Promise(function(resolve) {
    checkCollaboratorPermission(repo, resolve);
  });
}

function makePrBranch() {
  var login = (localStorage.getItem('samt-bu-gh-user') || 'user').replace(/[^a-zA-Z0-9._-]/g, '-');
  var now = new Date();
  var pad = function(n) { return String(n).padStart(2, '0'); };
  return login + '/suggest-' + now.getFullYear() + pad(now.getMonth()+1) + pad(now.getDate()) +
    '-' + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
}

function createPr(token, repo, branchName, title, body) {
  return fetch('https://api.github.com/repos/SAMT-X/' + repo + '/pulls', {
    method: 'POST',
    headers: { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' },
    body: JSON.stringify({ title: title, body: body || '', head: branchName, base: 'main' })
  }).then(function(r) {
    if (!r.ok) return r.json().then(function(j) { throw new Error(j.message || r.statusText); });
    return r.json();
  });
}

function ensureForkReady(token, repo) {
  var login = localStorage.getItem('samt-bu-gh-user');
  var h = { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
  return fetch('https://api.github.com/repos/SAMT-X/' + repo + '/git/refs/heads/main', { headers: h, cache: 'no-store' })
    .then(function(r) { return r.json(); })
    .then(function(ref) {
      var upstreamSha = ref.object.sha;
      return fetch('https://api.github.com/repos/' + login + '/' + repo, { headers: h })
        .then(function(r2) {
          if (r2.ok) {
            // Fork exists – sync main to upstream
            return fetch('https://api.github.com/repos/' + login + '/' + repo + '/git/refs/heads/main', {
              method: 'PATCH', headers: h, body: JSON.stringify({ sha: upstreamSha, force: true })
            });
          } else {
            // Create fork and wait for it to be ready
            return fetch('https://api.github.com/repos/SAMT-X/' + repo + '/forks', {
              method: 'POST', headers: h, body: JSON.stringify({})
            }).then(function() {
              var attempts = 0;
              function waitForFork() {
                attempts++;
                if (attempts > 20) throw new Error('Fork-opprettelse tok for lang tid – prøv igjen');
                return new Promise(function(res) { setTimeout(res, 2000); })
                  .then(function() { return fetch('https://api.github.com/repos/' + login + '/' + repo, { headers: h }); })
                  .then(function(r3) { if (r3.ok) return; return waitForFork(); });
              }
              return waitForFork();
            });
          }
        });
    });
}

// Worker-proxy for eksterne bidragsytere: branch + commit + PR i SAMT-X (ingen fork)
function suggestViaWorker(repo, branch, treeItems, deletePrefix, commitMessage, prTitle, prBody) {
  var token = getStoredToken();
  if (!token) return Promise.reject(new Error('Ikke innlogget'));
  var payload = { repo: repo, branch: branch, commitMessage: commitMessage, prTitle: prTitle, userToken: token };
  if (prBody) payload.prBody = prBody;
  if (treeItems) payload.treeItems = treeItems;
  if (deletePrefix) payload.deletePrefix = deletePrefix;
  return fetch('https://auth.samt-bu.no/suggest', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(payload)
  }).then(function(r) {
    if (!r.ok) return r.json().then(function(j) { throw new Error(j.error || r.statusText); });
    return r.json();
  }).then(function(data) {
    return { html_url: data.pr_url, number: data.pr_number };
  });
}

// Persistent bygg-sporing på tvers av sidenavigering (localStorage)
var SAMTBU_PENDING_KEY = 'samt-bu-build-pending';
function samtbuGetPending() {
  try { return JSON.parse(localStorage.getItem(SAMTBU_PENDING_KEY)); } catch(e) { return null; }
}
function samtbuIncrementPending() {
  var p = samtbuGetPending() || { count: 0 };
  var now = Date.now();
  var actor = localStorage.getItem('samt-bu-gh-user') || '';
  var newCount = (p.count || 0) + 1;
  try { localStorage.setItem(SAMTBU_PENDING_KEY, JSON.stringify({ count: newCount, firstSaveAt: p.firstSaveAt || now, lastSaveAt: now, seenCompleted: p.seenCompleted || 0, seenCancelled: p.seenCancelled || 0, actor: p.actor || actor, moduleRepo: p.moduleRepo || false })); } catch(e) {}
  samtbuShowPendingIndicator(newCount);
}
function samtbuDecrementPending() {
  var p = samtbuGetPending();
  if (!p) return;
  var newCount = (p.count || 1) - 1;
  if (newCount <= 0) {
    samtbuClearPending();
  } else {
    try { localStorage.setItem(SAMTBU_PENDING_KEY, JSON.stringify({ count: newCount, firstSaveAt: p.firstSaveAt, lastSaveAt: p.lastSaveAt, seenCompleted: (p.seenCompleted || 0) + 1 })); } catch(e) {}
    samtbuShowPendingIndicator(newCount);
  }
}
function samtbuClearPending() {
  try { localStorage.removeItem(SAMTBU_PENDING_KEY); } catch(e) {}
}
function samtbuShowPendingIndicator(count) {
  samtbuShowPendingIndicatorWithTotal(count, null);
}
function samtbuShowPendingIndicatorWithTotal(count, totalActive) {
  var ind = document.getElementById('qe-job-indicator');
  if (!ind) return;
  var isEn = document.documentElement.lang === 'en';
  var label = count === 1
    ? (isEn ? '1 change building\u2026' : '1 endring bygges\u2026')
    : (isEn ? count + ' changes building\u2026' : count + ' endringer bygges\u2026');
  var totalSuffix = (totalActive !== null && totalActive > count)
    ? ' <span style="opacity:.6;">(' + (isEn ? totalActive + ' total' : totalActive + ' totalt') + ')</span>'
    : '';
  ind.innerHTML = '<i class="fa fa-spinner fa-spin" style="font-size:12px; opacity:.85;"></i><span style="margin-left:7px;">' + label + totalSuffix + '</span>';
  ind.dataset.building = '1';
  ind.style.display = 'flex';
}
function samtbuShowDoneIndicator() {
  var ind = document.getElementById('qe-job-indicator');
  if (!ind) return;
  var isEn = document.documentElement.lang === 'en';
  var url = window.location.href.split('?')[0] + '?_=' + Date.now();
  var label = isEn ? 'Changes published \u2013 click to reload' : 'Endringer publisert \u2013 klikk for \u00e5 laste inn';
  ind.innerHTML = '<a href="' + url + '" style="color:#9de; display:flex; align-items:center; gap:7px; text-decoration:none;"><i class="fa fa-check-circle" style="font-size:12px;"></i><span>' + label + '</span></a>';
  ind.removeAttribute('data-building');
  ind.style.display = 'flex';
}

function samtbuShowExternalBuildIndicator() {

}

    var el = document.getElementById(id);
    return el && el.style.display !== 'none';
  });
}
(function() {
  var OVERLAY_IDS = ['qe-overlay', 'np-overlay', 'del-overlay', 'cm-overlay'];
  var COMMIT_IDS  = ['qe-save-btn', 'np-submit', 'del-confirm-btn', 'del-final-btn', 'cm-submit'];
  var CANCEL_IDS  = ['qe-cancel-btn', 'np-cancel', 'del-cancel', 'del-close-x',
                     'del-panel-close', 'del-back-btn', 'cm-cancel-btn'];

  function hasUnsavedDialog() {
    return OVERLAY_IDS.some(function(id) {
      var el = document.getElementById(id);
      return el && el.style.display !== 'none' && el.dataset.dirty === '1';
    });
  }

  // Sett dirty når overlay vises, fjern når det skjules
  OVERLAY_IDS.forEach(function(id) {
    var el = document.getElementById(id);
    if (!el) return;
    new MutationObserver(function() {
      if (el.style.display !== 'none') { el.dataset.dirty = '1'; }
      else { delete el.dataset.dirty; }
    }).observe(el, { attributes: true, attributeFilter: ['style'] });
  });

  // Fjern dirty og session-state ved Lagre eller Avbryt
  document.addEventListener('click', function(e) {
    var id = e.target && e.target.id;
    if (COMMIT_IDS.indexOf(id) !== -1 || CANCEL_IDS.indexOf(id) !== -1) {
      OVERLAY_IDS.forEach(function(oid) {
        var el = document.getElementById(oid);
        if (el) delete el.dataset.dirty;
      });
      typeof _dlgClear === 'function' && _dlgClear();
    }
  }, true);

  // Egen bekreftelsesdialog – ingen nettleser-prefiks, full kontroll over tekst
  function samtbuConfirmNav(msg, onConfirm) {
    var isEn = document.documentElement.lang === 'en';
    var wrap = document.createElement('div');
    wrap.style.cssText = 'position:fixed;inset:0;z-index:999999;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.45);';
    var box = document.createElement('div');
    box.style.cssText = 'background:#fff;border-radius:8px;box-shadow:0 8px 32px rgba(0,0,0,.3);padding:1.5rem 1.8rem;max-width:420px;width:90vw;font-family:inherit;font-size:16px;color:#222;';
    var txt = document.createElement('p');
    txt.style.cssText = 'margin:0 0 1.3rem;line-height:1.55;';
    txt.textContent = msg;
    var row = document.createElement('div');
    row.style.cssText = 'display:flex;gap:.7rem;justify-content:flex-end;';
    var stayBtn = document.createElement('button');
    stayBtn.textContent = isEn ? 'Stay' : 'Bli på siden';
    stayBtn.style.cssText = 'padding:.5rem 1.2rem;border:1px solid #ccc;border-radius:5px;background:#fff;cursor:pointer;font-size:15px;font-family:inherit;';
    var leaveBtn = document.createElement('button');
    leaveBtn.textContent = isEn ? 'Discard and navigate' : 'Forkast og naviger';
    leaveBtn.style.cssText = 'padding:.5rem 1.2rem;border:none;border-radius:5px;background:#1a4a8a;color:#fff;cursor:pointer;font-size:15px;font-family:inherit;font-weight:600;';
    stayBtn.addEventListener('click', function() { wrap.remove(); });
    leaveBtn.addEventListener('click', function() { wrap.remove(); onConfirm(); });
    row.appendChild(stayBtn); row.appendChild(leaveBtn);
    box.appendChild(txt); box.appendChild(row);
    wrap.appendChild(box); document.body.appendChild(wrap);
    stayBtn.focus();
  }

  // Fang navigasjonsklikk med ulagret innhold
  document.addEventListener('click', function(e) {
    if (!hasUnsavedDialog()) return;
    var link = e.target.closest('a[href]');
    if (!link) return;
    var href = link.getAttribute('href') || '';
    if (!href || href.startsWith('#') || href.startsWith('javascript') || link.target === '_blank') return;
    e.preventDefault();
    e.stopImmediatePropagation();
    var dest = link.href;
    // qe/np/cm: lagre tilstand i sessionStorage og naviger uten advarsel (dialogen gjenopprettes på neste side)
    var activeId = OVERLAY_IDS.filter(function(id) {
      var el = document.getElementById(id);
      return el && el.style.display !== 'none' && el.dataset.dirty === '1';
    })[0];
    if (activeId && activeId !== 'del-overlay') {
      typeof _dlgSave === 'function' && _dlgSave();
      window.location.href = dest;
      return;
    }
    // del-overlay: vis bekreftelsesdialog (ingenting å bevare)
    var isEn = document.documentElement.lang === 'en';
    var msg = isEn
      ? 'The open dialog has unsaved content. Close the dialog and discard the changes?'
      : 'Den åpne dialogen har ulagret innhold. Vil du lukke denne dialogboksen og forkaste endringene?';
    samtbuConfirmNav(msg, function() { window.location.href = dest; });
  }, true);
})();

// Lydsignal ved ferdig bygg – beep (Web Audio) + tale (Web Speech)
// Chrome blokkerer AudioContext og speechSynthesis fra setInterval uten brukergestus.
// Løsning: lås opp begge på Lagre-klikk (gestus), gjenbruk konteksten ved ferdig bygg.
var _samtbuAudioCtx = null;

function samtbuUnlockAudio() {
  // Opprett/gjenoppta AudioContext under brukergestus
  try {
    if (!_samtbuAudioCtx) _samtbuAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (_samtbuAudioCtx.state === 'suspended') _samtbuAudioCtx.resume();
  } catch(e) {}
  // Lås opp speechSynthesis med stille ytring under brukergestus
  try {
    var u = new SpeechSynthesisUtterance(' ');
    u.volume = 0;
    window.speechSynthesis.speak(u);
  } catch(e) {}
}

// Spill av noter via Web Audio API.
// notes: [[hz, startOffset, duration], ...]
// Returnerer total varighet i ms (brukes til å forsinke talen).
function _samtbuPlayNotes(notes) {
  var end = 0;
  notes.forEach(function(n) { end = Math.max(end, n[1] + n[2]); });
  if (!_samtbuAudioCtx) {
    try { _samtbuAudioCtx = new (window.AudioContext || window.webkitAudioContext)(); } catch(e) {}
  }
  if (!_samtbuAudioCtx) return Math.ceil(end * 1000);
  _samtbuAudioCtx.resume().then(function() {
    var t = _samtbuAudioCtx.currentTime;
    notes.forEach(function(n) {
      var hz = n[0], s = n[1], d = n[2];
      var osc = _samtbuAudioCtx.createOscillator();
      var g = _samtbuAudioCtx.createGain();
      osc.connect(g); g.connect(_samtbuAudioCtx.destination);
      osc.frequency.value = hz;
      // ADSR: rask attack (20ms), sustain, kort release (80ms eller 30% av notelengde)
      var rel = Math.min(0.08, d * 0.3);
      g.gain.setValueAtTime(0.001, t + s);
      g.gain.linearRampToValueAtTime(0.32, t + s + 0.02);
      g.gain.setValueAtTime(0.32, t + s + d - rel);
      g.gain.exponentialRampToValueAtTime(0.001, t + s + d);
      osc.start(t + s);
      osc.stop(t + s + d + 0.01);
    });
  });
  return Math.ceil(end * 1000);
}

// Spill tale etter en forsinkelse (slik at lydsignal alltid kommer først)
function _samtbuSpeak(text, delayMs) {
  try {
    setTimeout(function() {
      var u = new SpeechSynthesisUtterance(text);
      u.lang = 'en-US';
      window.speechSynthesis.speak(u);
    }, delayMs);
  } catch(e) {}
}

// Opptakt – to stigende pip (kalles når byggjobb starter)
function samtbuPlayStart(speechText) {
  // 600 Hz (120ms) → 900 Hz (200ms) → tale
  var ms = _samtbuPlayNotes([[600,0,0.12],[900,0.15,0.20]]);
  _samtbuSpeak(speechText || 'Build job started', ms + 150);
}

// Hjelpefunksjon: tall til ord for TTS (0–10, ellers siffer)
function _numWord(n) {
  var w = ['zero','one','two','three','four','five','six','seven','eight','nine','ten'];
  return n >= 0 && n < w.length ? w[n] : String(n);
}

// Seiersfanfare – C-E-G-C stigende (kalles når bygg er ferdig)
function samtbuPlaySuccess(speechText) {
  // C5–E5–G5–C6, siste tone lang for avslutningseffekt
  var ms = _samtbuPlayNotes([[523,0,0.22],[659,0.25,0.22],[784,0.50,0.22],[1047,0.75,0.60]]);
  _samtbuSpeak(speechText || 'Build job complete', ms + 150);
}

// Wah-wah – tre fallende toner (kalles ved feil eller timeout)
function samtbuPlayFailure() {
  // 400 → 300 → 220 Hz, siste tone lang
  var ms = _samtbuPlayNotes([[400,0,0.25],[300,0.28,0.25],[220,0.56,0.55]]);
  _samtbuSpeak('Build job failed', ms + 150);
}

// Poll GitHub Actions workflow – brukes for rediger og slett (2s intervall)
function startGhPoll(startTime, onDone, onError, onStatus) {
  samtbuPlayStart();
  var token = getStoredToken();
  var h = { 'Accept': 'application/vnd.github+json' };
  if (token) h['Authorization'] = 'token ' + token;
  return setInterval(function() {
    fetch('https://api.github.com/repos/SAMT-X/samt-bu-docs/actions/workflows/hugo.yml/runs?per_page=5', { headers: h })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.workflow_runs) return;
        var run = null;
        for (var i = 0; i < data.workflow_runs.length; i++) {
          if (new Date(data.workflow_runs[i].created_at).getTime() >= startTime - 30000) {
            run = data.workflow_runs[i]; break;
          }
        }
        if (!run) { onStatus('Venter på bygg…'); return; }
        if (run.status === 'queued' || run.status === 'in_progress') {
          onStatus('Bygger…');
        } else if (run.status === 'completed') {
          if (run.conclusion === 'success') { samtbuPlaySuccess(); onDone(); }
          else if (run.conclusion === 'cancelled') { onStatus('Avløst – venter på nytt bygg…'); }
          else { samtbuPlayFailure(); onError(run.conclusion); }
        }
      })
      .catch(function() { onStatus('Sjekker…'); });
  }, 2000);
}

// Poll URL direkte – brukes for ny side (same-origin, ingen token)
function startUrlPoll(url, onDone, onError, onStatus, startTime) {
  samtbuPlayStart();
  var attempts = 0;
  var _checkingApi = false;
  var timer = setInterval(function() {
    if (++attempts > 90) {
      if (_checkingApi) return; // Unngå parallelle API-kall
      _checkingApi = true;
      // Sjekk faktisk byggestatus – rapporter kun feil hvis GitHub bekrefter det
      var _tok = getStoredToken();
      var _h = { 'Accept': 'application/vnd.github+json' };
      if (_tok) _h['Authorization'] = 'token ' + _tok;
      var _since = startTime || (Date.now() - 120000);
      fetch('https://api.github.com/repos/SAMT-X/samt-bu-docs/actions/workflows/hugo.yml/runs?per_page=5', { headers: _h })
        .then(function(r) { return r.json(); })
        .then(function(data) {
          _checkingApi = false;
          var run = null;
          if (data.workflow_runs) {
            for (var i = 0; i < data.workflow_runs.length; i++) {
              if (new Date(data.workflow_runs[i].created_at).getTime() >= _since - 30000) {
                run = data.workflow_runs[i]; break;
              }
            }
          }
          if (!run) { clearInterval(timer); samtbuPlayFailure(); onError('timeout'); return; }
          if (run.status === 'in_progress' || run.status === 'queued') {
            attempts = 0; // Bygg pågår – nullstill teller og fortsett poll
          } else if (run.status === 'completed' && run.conclusion === 'success') {
            clearInterval(timer); samtbuPlaySuccess(); onDone();
          } else if (run.status === 'completed' && run.conclusion === 'cancelled') {
            attempts = 0; onStatus('Avbrutt – venter på nytt bygg…');
          } else {
            clearInterval(timer); samtbuPlayFailure(); onError(run.conclusion || 'timeout');
          }
        })
        .catch(function() { _checkingApi = false; clearInterval(timer); samtbuPlayFailure(); onError('timeout'); });
      return;
    }
    fetch(url + (url.indexOf('?') >= 0 ? '&' : '?') + '_cf=' + Date.now(),
          { method: 'HEAD', cache: 'no-store' })
      .then(function(r) {
        if (r.ok) { samtbuPlaySuccess(); onDone(); }
        else onStatus(attempts);
      })
      .catch(function() { onStatus('Venter…'); });
  }, 1000);
  return timer;
}

// TipTap lazy-laster (delt av np-dialog og qe-dialog)
function loadTiptap(callback) {
  if (window._Tiptap) { callback(); return; }
  if (window._tiptapLoading) {
    window.addEventListener('tiptap-ready', function h() { window.removeEventListener('tiptap-ready', h); callback(); });
    return;
  }
  window._tiptapLoading = true;
  // Selvhostet bundle – unngår esm.sh CDN-instabilitet (se endringslogg 2026-03-14)
  import('/js/tiptap-bundle.js').then(function(mod) {
    window._Tiptap = {
      Editor:      mod.Editor,
      StarterKit:  mod.StarterKit,
      Table:       mod.Table,
      TableRow:    mod.TableRow,
      TableCell:   mod.TableCell,
      TableHeader: mod.TableHeader,
      Link:        mod.Link,
      Image:       mod.Image,
      Markdown:    mod.Markdown
    };
    window.dispatchEvent(new Event('tiptap-ready'));
    callback();

// Gjenopprett pending-spinner ved sideinnlasting og tell ned per ferdig bygg
setTimeout(function() {
  var p = samtbuGetPending();
  if (!p || !p.count || !p.firstSaveAt) return;
  if ((Date.now() - p.firstSaveAt) > 600000) { samtbuClearPending(); return; } // > 10 min – anta ferdig
  samtbuShowPendingIndicator(p.count);
  var token = getStoredToken();
  var h = { 'Accept': 'application/vnd.github+json' };
  if (token) h['Authorization'] = 'token ' + token;
  function checkCompletions() {
    var p2 = samtbuGetPending();
    if (!p2 || !p2.count) { clearInterval(resumeTimer); return; }
    fetch('https://api.github.com/repos/SAMT-X/samt-bu-docs/actions/workflows/hugo.yml/runs?per_page=20', { headers: h, cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(data) {
        if (!data.workflow_runs) return;
        var myCompletedTotal = 0, myCancelledTotal = 0, myActive = 0, totalActive = 0;
        for (var i = 0; i < data.workflow_runs.length; i++) {
          var run = data.workflow_runs[i];
          if (new Date(run.created_at).getTime() < p2.firstSaveAt - 30000) break;
          var isMine = !p2.actor ||
            (run.triggering_actor && run.triggering_actor.login === p2.actor) ||
            (p2.moduleRepo && run.event === 'repository_dispatch' && run.triggering_actor && run.triggering_actor.login === 'samt-x-bot');
          if (run.status === 'completed') {
            if (isMine) {
              if (run.conclusion === 'success') myCompletedTotal++;
              else if (run.conclusion === 'cancelled') myCancelledTotal++;
            }
          } else if (run.status === 'queued' || run.status === 'in_progress') {
            totalActive++;
            if (isMine) myActive++;
          }
        }
        var othersActive = totalActive - myActive;
        // allMyDone: ingen av mine kjøringer er aktive lenger, og minst én lyktes
        // (kansellerte avløste jobber teller ikke mot fullføring, men blokkerer ikke done)
        var allMyDone = (myActive === 0 && myCompletedTotal > 0);

        var prevSeenCancelled = p2.seenCancelled || 0;
        var newCancellations = myCancelledTotal - prevSeenCancelled;

        var prevSeen = p2.seenCompleted || 0;
        var newCompletions = myCompletedTotal - prevSeen;

        if (allMyDone) {
          // Alle mine endringer er deployet
          clearInterval(resumeTimer);
          samtbuClearPending();
          samtbuShowDoneIndicator();
          var doneSpeech = 'All your documentation jobs completed';
          if (othersActive > 0) {
            doneSpeech += ', ' + _numWord(othersActive) + ' other update ' + (othersActive === 1 ? 'job' : 'jobs') + ' in progress';
          }
          samtbuPlaySuccess(doneSpeech);
          if (!samtbuHasVisibleDialog()) {
            setTimeout(function() {
              window.location.href = window.location.href.split('?')[0] + '?_=' + Date.now();
            }, 1800);
          }
        } else if (newCompletions > 0 || newCancellations > 0) {
          // Nye fullføringer eller kanseller – oppdater teller og lagret tilstand
          var newCount = Math.max(1, (p2.count || 0) - newCompletions);
          try {
            localStorage.setItem(SAMTBU_PENDING_KEY, JSON.stringify({
              count: newCount, firstSaveAt: p2.firstSaveAt, lastSaveAt: p2.lastSaveAt,
              seenCompleted: myCompletedTotal, seenCancelled: myCancelledTotal, actor: p2.actor,
              moduleRepo: p2.moduleRepo || false
            }));
          } catch(e) {}
          samtbuShowPendingIndicatorWithTotal(newCount, totalActive);
          if (newCompletions > 0) {
            var completedWord = newCompletions === 1 ? 'One of your documentation jobs completed' : _numWord(newCompletions) + ' of your documentation jobs completed';
            var remainingWord = newCount === 1 ? 'one remaining' : _numWord(newCount) + ' remaining';
            samtbuPlaySuccess(completedWord + ', ' + remainingWord);
          }
        } else {
          // Ingen nye hendelser ennå
          samtbuShowPendingIndicatorWithTotal(p2.count, totalActive);
        }
      })
      .catch(function() {});
  }
  checkCompletions();
  var resumeTimer = setInterval(checkCompletions, 3000);
}, 200);
</script>

<script>
(function() {
  var toggle = document.getElementById('edit-toggle');
  var menu = document.getElementById('edit-menu');
  if (!toggle || !menu) return;

  // Lagre originaltekster én gang – brukes til reset ved hvert åpning
  menu.querySelectorAll('li a span').forEach(function(span) {
    span.dataset.orig = span.textContent;
  });

  toggle.addEventListener('click', function(e) {
    e.stopPropagation();
    if (!getStoredToken()) {
      doGitHubLogin(function() { fetchCurrentUser(function() {}); });
      return;
    }
    menu.classList.toggle('open');
    var langMenu = document.getElementById('lang-menu');
    var temaMenu = document.getElementById('tema-menu');
    if (langMenu) langMenu.classList.remove('open');
    if (temaMenu) temaMenu.classList.remove('open');
    if (menu.classList.contains('open')) {
      var repo = toggle.dataset.repo;
      if (repo) {
        // Reset til originaltekst (håndterer brukerbytte uten sidereload)
        menu.querySelectorAll('li a span').forEach(function(span) {
          if (span.dataset.orig) span.textContent = span.dataset.orig;
        });
        checkCollaboratorPermission(repo, function(canWrite) {
          if (!canWrite) {
            menu.querySelectorAll('li a span').forEach(function(span) {
              var t = span.dataset.orig || span.textContent;
              if (t === 'Rediger dette kapitlet') span.textContent = 'Foreslå endring av dette kapitlet';
              else if (t === 'Edit this chapter') span.textContent = 'Suggest change to this chapter';
              else if (t === 'Nytt kapittel etter dette') span.textContent = 'Foreslå nytt kapittel etter dette';
              else if (t === 'New chapter after this') span.textContent = 'Suggest new chapter after this';
              else if (t === 'Nytt underkapittel') span.textContent = 'Foreslå nytt underkapittel';
              else if (t === 'New sub-chapter') span.textContent = 'Suggest new sub-chapter';
              else if (t === 'Slett denne siden') span.textContent = 'Foreslå sletting av denne siden';
              else if (t === 'Delete this page') span.textContent = 'Suggest deletion of this page';
            });
          }
        });
      }
    }
  });
  document.addEventListener('click', function() {
    menu.classList.remove('open');
  });
})();
</script>

<!-- Avatar-dropdown: vis bruker og logg ut -->
<script>
(function() {
  var wrap  = document.getElementById('samt-bu-avatar-wrap');
  var img   = document.getElementById('samt-bu-user-avatar');
  var menu  = document.getElementById('samt-bu-avatar-menu');
  var logoutBtn = document.getElementById('samt-bu-logout-btn');
  var switchBtn = document.getElementById('samt-bu-switch-btn');
  var loginBtn2 = document.getElementById('samt-bu-login-btn');
  if (!wrap) return;

  if (loginBtn2) {
    loginBtn2.addEventListener('click', function(e) {
      e.preventDefault();
      doGitHubLogin(function() {
        fetchCurrentUser(function() {});
      });
    });
  }

  if (!img || !menu) return;

  img.addEventListener('click', function(e) {
    e.stopPropagation();
    var isOpen = menu.style.display !== 'none';
    menu.style.display = isOpen ? 'none' : 'block';
    closeSwitchForm();   // menyen skal alltid åpne på lenken, ikke midt i skjemaet
    // Lukk andre menyer
    ['edit-menu','lang-menu','tema-menu'].forEach(function(id) {
      var el = document.getElementById(id);
      if (el) el.classList.remove('open');
    });
  });

  /* Bytt bruker krever brukernavn.
     GitHub bytter ikke konto av seg selv: har du en aktiv sesjon på github.com
     og appen er godkjent fra før, sender authorize-URL-en deg rett tilbake som
     samme bruker. Heller ikke force=true hjelper – den ruter via
     github.com/login, som bare viser skjemaet hvis du er utlogget.
     login=<brukernavn> er den dokumenterte måten å be om en bestemt konto, og
     workeren videresender den i handleAuth. */
  var switchFormRow = document.getElementById('samt-bu-switch-form-row');
  var switchRow     = document.getElementById('samt-bu-switch-row');
  var switchInput   = document.getElementById('samt-bu-switch-input');
  var switchConfirm = document.getElementById('samt-bu-switch-confirm');
  var switchMsg     = document.getElementById('samt-bu-switch-msg');

  function closeSwitchForm() {
    if (switchFormRow) switchFormRow.style.display = 'none';
    if (switchRow)     switchRow.style.display     = 'block';
    if (switchMsg)     switchMsg.style.display     = 'none';
  }

  function doSwitchUser() {
    var username = switchInput ? switchInput.value.trim().replace(/^@/, '') : '';
    if (!username) {
      if (switchInput) switchInput.focus();
      return;
    }
    // GitHub-brukernavn: bokstaver, tall og bindestrek
    if (!/^[A-Za-z0-9](?:[A-Za-z0-9-]{0,37}[A-Za-z0-9])?$/.test(username)) {
      if (switchMsg) {
        switchMsg.textContent = (window._samtbuThisPage && window._samtbuThisPage.lang === 'en')
          ? 'Not a valid GitHub username.' : 'Ikke et gyldig GitHub-brukernavn.';
        switchMsg.style.display = 'block';
      }
      return;
    }
    menu.style.display = 'none';
    closeSwitchForm();
    samtbuLogout();
    doGitHubLogin(function() { fetchCurrentUser(function() {}); }, username);
  }

  if (switchBtn) {
    switchBtn.addEventListener('click', function(e) {
      e.preventDefault();
      e.stopPropagation();
      if (switchFormRow) switchFormRow.style.display = 'block';
      if (switchRow)     switchRow.style.display     = 'none';
      if (switchMsg)     switchMsg.style.display     = 'none';
      if (switchInput)   { switchInput.value = ''; switchInput.focus(); }
    });
  }

  // Klikk inne i skjemaet må ikke boble opp til document-handleren som lukker menyen
  if (switchFormRow) {
    switchFormRow.addEventListener('click', function(e) { e.stopPropagation(); });
  }
  if (switchConfirm) {
    switchConfirm.addEventListener('click', function(e) {
      e.preventDefault(); e.stopPropagation(); doSwitchUser();
    });
  }
  if (switchInput) {
    switchInput.addEventListener('keydown', function(e) {
      if (e.key === 'Enter')  { e.preventDefault(); doSwitchUser(); }
      if (e.key === 'Escape') { e.preventDefault(); closeSwitchForm(); }
    });
  }

  if (logoutBtn) {
    logoutBtn.addEventListener('click', function(e) {
      e.preventDefault();
      menu.style.display = 'none';
      closeSwitchForm();
      samtbuLogout();
      // Forklar at GitHub-sesjonen består – ellers ser utloggingen ut som en feil
      samtbuLogoutNotice();
    });
  }

  document.addEventListener('click', function() {
    if (menu) menu.style.display = 'none';
    closeSwitchForm();   // neste åpning skal starte på lenken, ikke i skjemaet
  });
})();
</script>

<!-- Ny side – samme nivå: dialog og GitHub API -->
<script>
(function() {
  var overlay = document.getElementById('np-overlay');
  if (!overlay) return;

  var npEditor = null;
  var npImages = {};   // { 'bilde-123.png': '<base64>' }
  var npImageMap = {}; // { 'data:image/...base64...' : 'bilde-123.png' }

  function initNpEditor(callback) {
    if (npEditor) {
      npEditor.commands.setContent('');
      npImages = {}; npImageMap = {};
      callback(); return;
    }
    loadTiptap(function() {
      var T = window._Tiptap;
      npEditor = new T.Editor({
        element: document.getElementById('np-body-pm'),
        extensions: [
          T.StarterKit,
          T.Table.configure({ resizable: false }),
          T.TableRow,
          T.TableCell,
          T.TableHeader,
          T.Link.configure({ openOnClick: false }),
          T.Image,
          T.Markdown.configure({ html: false, transformPastedText: true })
        ],
        content: ''
      });
      setupNpToolbar(npEditor);
      npEditor.view.dom.addEventListener('paste', function(e) {
        var items = e.clipboardData && e.clipboardData.items;
        if (!items) return;
        for (var i = 0; i < items.length; i++) {
          if (items[i].type.indexOf('image') !== -1) {
            e.preventDefault();
            (function(item) {
              var ext = item.type === 'image/jpeg' ? 'jpg' : 'png';
              var fname = 'bilde-' + Date.now() + '.' + ext;
              var reader = new FileReader();
              reader.onload = function(evt) {
                var dataUrl = evt.target.result;
                npImages[fname] = dataUrl.split(',')[1];
                npImageMap[dataUrl] = fname;
                npEditor.chain().focus().setImage({ src: dataUrl }).run();
              };
              reader.readAsDataURL(item.getAsFile());
            })(items[i]);
            break;
          }
        }
      }, true);
      callback();
    });
  }

  function setupNpToolbar(editor) {
    var toolbar = document.getElementById('np-toolbar');
    if (!toolbar) return;
    toolbar.addEventListener('click', function(e) {
      var btn = e.target.closest('[data-np]');
      if (!btn) return;
      e.preventDefault();
      var cmd = btn.getAttribute('data-np');
      switch(cmd) {
        case 'bold':   editor.chain().focus().toggleBold().run(); break;
        case 'italic': editor.chain().focus().toggleItalic().run(); break;
        case 'h2':     editor.chain().focus().toggleHeading({ level: 2 }).run(); break;
        case 'h3':     editor.chain().focus().toggleHeading({ level: 3 }).run(); break;
        case 'ul':     editor.chain().focus().toggleBulletList().run(); break;
        case 'ol':     editor.chain().focus().toggleOrderedList().run(); break;
        case 'link':
          var url = window.prompt('URL:');
          if (url) editor.chain().focus().setLink({ href: url }).run();
          else if (editor.isActive('link')) editor.chain().focus().unsetLink().run();
          break;
        case 'table':
          editor.chain().focus().insertTable({ rows: 3, cols: 3, withHeaderRow: true }).run(); break;
      }
      updateNpToolbarState(editor);
    });
    editor.on('selectionUpdate', function() { updateNpToolbarState(editor); });
    editor.on('transaction',     function() { updateNpToolbarState(editor); });
  }

  function updateNpToolbarState(editor) {
    var tb = document.getElementById('np-toolbar');
    if (!tb) return;
    tb.querySelectorAll('[data-np]').forEach(function(btn) {
      var cmd = btn.getAttribute('data-np');
      var active = false;
      if      (cmd === 'bold')   active = editor.isActive('bold');
      else if (cmd === 'italic') active = editor.isActive('italic');
      else if (cmd === 'h2')     active = editor.isActive('heading', { level: 2 });
      else if (cmd === 'h3')     active = editor.isActive('heading', { level: 3 });
      else if (cmd === 'ul')     active = editor.isActive('bulletList');
      else if (cmd === 'ol')     active = editor.isActive('orderedList');
      else if (cmd === 'link')   active = editor.isActive('link');
      btn.classList.toggle('is-active', active);
    });
  }

  function npEditorToMarkdown() {
    if (!npEditor) return '';
    var md = npEditor.storage.markdown.getMarkdown();
    Object.keys(npImageMap).forEach(function(dataUrl) { md = md.split(dataUrl).join(npImageMap[dataUrl]); });
    return md.trim();
  }

  // Laster opp binærfiler som GitHub-blobs, returnerer tree-items med SHA
  function uploadImageBlobs(token, repo, dirPath, images) {
    var names = Object.keys(images);
    if (!names.length) return Promise.resolve([]);
    var apiBase = 'https://api.github.com/repos/SAMT-X/' + repo;
    var h = { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json', 'Content-Type': 'application/json' };
    return Promise.all(names.map(function(fname) {
      return fetch(apiBase + '/git/blobs', {
        method: 'POST', headers: h,
        body: JSON.stringify({ content: images[fname], encoding: 'base64' })
      })
      .then(function(r) { return r.json(); })
      .then(function(blob) {
        return { path: dirPath + '/' + fname, mode: '100644', type: 'blob', sha: blob.sha };
      });
    }));
  }

  var npRepo = '';
  var npParentPath = '';
  var npLang = 'nb';
  var npCurrentPermalink = '';
  var npNewPageUrl = '';
  var npTitle = '';
  var npActivePollTimer = null;
  var npDialogVisible = false;
  var npMode = 'sibling'; // 'sibling' | 'child'

  var STATUS_EN_MAP = {
    'Ny': 'New',
    'Tidlig utkast': 'Early draft',
    'Pågår': 'In progress',
    'Til QA': 'For QA',
    'Godkjent': 'Approved',
    'Avbrutt': 'Cancelled'
  };

  function generateSlug(text) {
    return text.toLowerCase()
      .replace(/æ/g, 'ae').replace(/ø/g, 'oe').replace(/å/g, 'aa')
      .replace(/[^a-z0-9]+/g, '-')
      .replace(/^-+|-+$/g, '')
      .replace(/-+/g, '-') || 'ny-side';
  }

  window.openNewSiblingDialog = function(repo, parentPath, lang, currentWeight, currentPermalink) {
    npMode = 'sibling';
    npRepo = repo;
    npParentPath = parentPath;
    npLang = lang || 'nb';
    npCurrentPermalink = currentPermalink || '';

    if (!getStoredToken()) {
      doGitHubLogin(function() {
        window.openNewSiblingDialog(repo, parentPath, lang, currentWeight, currentPermalink);
      });
      return;
    }

    document.getElementById('np-form').reset();
    document.getElementById('np-status').value = '';
    if (currentWeight) {
      document.getElementById('np-weight').value = currentWeight + 10;
    }
    hideMsg();
    var submitBtn = document.getElementById('np-submit');
    submitBtn.disabled = false;
    submitBtn.textContent = npLang === 'en' ? 'Create page' : 'Opprett side';
    document.getElementById('np-cancel').textContent = npLang === 'en' ? 'Cancel' : 'Avbryt';

    document.getElementById('np-dialog-title').textContent = npLang === 'en' ? 'New page – same level' : 'Ny side – samme nivå';
    setNpStatus('');
    npDialogVisible = true;
    overlay.style.display = 'flex';
    window._applyDialogPos && window._applyDialogPos('np-overlay');
    fetchCurrentUser(function() { presenceOpen('np', currentPermalink); });
    initNpEditor(function() {
      var _r = window._dlgRestoring;
      if (_r && _r.type === 'np') {
        delete window._dlgRestoring;
        if (npEditor && _r.content) npEditor.commands.setContent(_r.content);
        var tNb = document.getElementById('np-title-nb');
        if (tNb && _r.title !== undefined) tNb.value = _r.title;
        var wEl = document.getElementById('np-weight'); if (wEl && _r.weight !== undefined) wEl.value = _r.weight;
        var sEl = document.getElementById('np-status'); if (sEl && _r.status !== undefined) sEl.value = _r.status;
        if (npEditor) npEditor.commands.focus();
      } else { document.getElementById('np-title-nb').focus(); }
    });
  };

  window.openNewChildDialog = function(repo, dirPath, lang, currentPermalink) {
    npMode = 'child';
    npRepo = repo;
    npParentPath = dirPath;
    npLang = lang || 'nb';
    npCurrentPermalink = currentPermalink || '';

    if (!getStoredToken()) {
      doGitHubLogin(function() {
        window.openNewChildDialog(repo, dirPath, lang, currentPermalink);
      });
      return;
    }

    document.getElementById('np-form').reset();
    document.getElementById('np-status').value = '';
    document.getElementById('np-weight').value = 10;
    hideMsg();
    var submitBtn = document.getElementById('np-submit');
    submitBtn.disabled = false;
    submitBtn.textContent = npLang === 'en' ? 'Create sub-chapter' : 'Opprett underkapittel';
    document.getElementById('np-cancel').textContent = npLang === 'en' ? 'Cancel' : 'Avbryt';

    document.getElementById('np-dialog-title').textContent = npLang === 'en' ? 'New sub-chapter' : 'Nytt underkapittel';
    setNpStatus('');
    npDialogVisible = true;
    overlay.style.display = 'flex';
    window._applyDialogPos && window._applyDialogPos('np-overlay');
    fetchCurrentUser(function() { presenceOpen('np', currentPermalink); });
    initNpEditor(function() {
      var _r = window._dlgRestoring;
      if (_r && _r.type === 'np') {
        delete window._dlgRestoring;
        if (npEditor && _r.content) npEditor.commands.setContent(_r.content);
        var tNb = document.getElementById('np-title-nb');
        if (tNb && _r.title !== undefined) tNb.value = _r.title;
        var wEl = document.getElementById('np-weight'); if (wEl && _r.weight !== undefined) wEl.value = _r.weight;
        var sEl = document.getElementById('np-status'); if (sEl && _r.status !== undefined) sEl.value = _r.status;
        if (npEditor) npEditor.commands.focus();
      } else { document.getElementById('np-title-nb').focus(); }
    });
  };

  function closeDialog() { presenceClose(); overlay.style.display = 'none'; npDialogVisible = false; }

  window._dlgSaveNp = function() {
    var el = document.getElementById('np-overlay');
    if (!el || el.style.display === 'none' || !npEditor) return null;
    var tNb = document.getElementById('np-title-nb');
    return { type:'np', mode:npMode, repo:npRepo, dirPath:npParentPath, lang:npLang,
      currentPermalink:npCurrentPermalink,
      title:(tNb||{}).value||'',
      weight:(document.getElementById('np-weight')||{}).value||'',
      status:(document.getElementById('np-status')||{}).value||'',
      content:npEditor.getJSON() };
  };

  // Fix 3: stopp piltaster og andre taster fra å nå globale handlers
  overlay.addEventListener('keydown', function(e) {
    if (e.key === 'Escape') { closeDialog(); }
    e.stopPropagation();
  });

  document.getElementById('np-cancel').addEventListener('click', closeDialog);

  // Fix 1: skjul feilmelding og merk dirty ved første input
  ['np-title-nb', 'np-linktitle-nb', 'np-weight', 'np-status'].forEach(function(id) {
    var el = document.getElementById(id);
    if (el) el.addEventListener('input', function() { hideMsg(); presenceMarkDirty(); });
  });

  document.getElementById('np-form').addEventListener('submit', function(e) {
    e.preventDefault();
    samtbuUnlockAudio(); // lås opp lyd under brukergestus

    var submitBtn = document.getElementById('np-submit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Oppretter…';
    submitBtn.style.background = '#888';
    submitBtn.style.cursor = 'default';

    var token = getStoredToken();
    if (!token) {
      submitBtn.disabled = false;
      submitBtn.textContent = npLang === 'en' ? 'Create page' : 'Opprett side';
      doGitHubLogin(function() {
        document.getElementById('np-form').dispatchEvent(new Event('submit', { bubbles: true, cancelable: true }));
      });
      return;
    }

    var titleNb     = document.getElementById('np-title-nb').value.trim();
    var linkTitleNb = document.getElementById('np-linktitle-nb').value.trim();
    var weight      = document.getElementById('np-weight').value.trim();
    var statusNb    = document.getElementById('np-status').value;
    var body        = npEditorToMarkdown();

    if (!titleNb) { submitBtn.disabled = false; submitBtn.textContent = npLang === 'en' ? 'Create page' : 'Opprett side'; showMsg('error', 'Tittel er påkrevd.'); return; }

    // Fix 2: auto-generer slug fra korttittel (evt. tittel)
    var slug = generateSlug(linkTitleNb || titleNb);
    hideMsg();
    var startTime = Date.now();

    var nbPath = npParentPath + '/' + slug + '/_index.nb.md';
    var enPath = npParentPath + '/' + slug + '/_index.en.md';
    var statusEn = STATUS_EN_MAP[statusNb] || 'New';
    var newId = (typeof crypto !== 'undefined' && crypto.randomUUID)
      ? crypto.randomUUID()
      : 'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g, function(c) {
          var r = Math.random() * 16 | 0;
          return (c === 'x' ? r : (r & 0x3 | 0x8)).toString(16);
        });

    var nbLines = ['---', 'id: ' + newId, 'title: ' + yamlStr(titleNb)];
    if (linkTitleNb) nbLines.push('linkTitle: ' + yamlStr(linkTitleNb));
    if (weight) nbLines.push('weight: ' + parseInt(weight, 10));
    if (statusNb) {
      nbLines.push('status: ' + statusNb);
      nbLines.push('# Gyldige verdier: Ny | Tidlig utkast | Pågår | Til QA | Godkjent | Avbrutt');
    }
    nbLines.push('---');
    if (body) { nbLines.push(''); nbLines.push(body); }
    var nbContent = nbLines.join('\n') + '\n';

    var enTitle = titleNb; // bruker norsk tittel som placeholder
    var enLines = ['---', 'id: ' + newId, 'title: ' + yamlStr(enTitle)];
    if (linkTitleNb) enLines.push('linkTitle: ' + yamlStr(linkTitleNb));
    if (weight) enLines.push('weight: ' + parseInt(weight, 10));
    if (statusNb) {
      enLines.push('status: ' + statusEn);
      enLines.push('# Valid values: New | Early draft | In progress | For QA | Approved | Cancelled');
    }
    enLines.push('---');
    enLines.push('');
    enLines.push('*English translation TBD.*');
    var enContent = enLines.join('\n') + '\n';

    var commitMsg = 'Ny side: ' + titleNb;
    var weightInt = weight ? parseInt(weight, 10) : null;
    var newFiles = [
      { path: nbPath, content: nbContent },
      { path: enPath, content: enContent }
    ];

    // Hent søskenfiler og last opp bilder parallelt – alt i én commit (retry ved konflikt)
    var imgDir = npParentPath + '/' + slug;
    function tryNpCommit(attemptsLeft, targetBranch, org) {
      return Promise.all([
        weightInt ? fetchSiblingWeightUpdates(token, npRepo, npParentPath, weightInt, slug) : Promise.resolve([]),
        uploadImageBlobs(token, npRepo, imgDir, npImages)
      ]).then(function(results) {
        return createFilesInOneCommit(token, npRepo, newFiles.concat(results[0]), commitMsg, results[1], targetBranch, org);
      }).catch(function(err) {
        if (err.message === 'Update is not a fast forward' && !targetBranch && attemptsLeft > 0) {
          setNpStatus(npLang === 'en' ? 'Retrying…' : 'Prøver på nytt…');
          return new Promise(function(res) { setTimeout(res, 1500); })
            .then(function() { return tryNpCommit(attemptsLeft - 1, targetBranch, org); });
        }
        throw err;
      });
    }
    checkCollaboratorPermission(npRepo, function(canWrite) {
      var branchName = canWrite ? null : makePrBranch();
      var npLogin = localStorage.getItem('samt-bu-gh-user') || 'unknown';
      var commitPromise = canWrite
        ? tryNpCommit(2)
        : Promise.all([
            weightInt ? fetchSiblingWeightUpdates(token, npRepo, npParentPath, weightInt, slug) : Promise.resolve([]),
            Promise.resolve([])
          ]).then(function(results) {
            var items = newFiles.concat(results[0]).map(function(f) {
              return {path: f.path, mode: '100644', type: 'blob', content: f.content};
            });
            var prTitle = (npLang === 'en' ? 'Suggest new page: ' : 'Foreslår ny side: ') + titleNb;
            var prBody = npLang === 'en'
              ? 'New page suggested by @' + npLogin + ' via SAMT-BU Docs editor.'
              : 'Ny side foreslått av @' + npLogin + ' via SAMT-BU Docs redigeringsgrensesnitt.';
            return suggestViaWorker(npRepo, branchName, items, null, commitMsg, prTitle, prBody);
          });
      commitPromise
        .then(function(result) {
          if (canWrite) {
            npTitle = titleNb;
            if (npMode === 'child') {
              npNewPageUrl = npCurrentPermalink.replace(/\/?$/, '/') + slug + '/';
            } else {
              var parentUrl = npCurrentPermalink.replace(/\/[^\/]+\/?$/, '/');
              npNewPageUrl = parentUrl + slug + '/';
            }
            showNpBuildPanel();
            samtbuIncrementPending();
            npPollBuild(startTime);
          } else {
            setNpStatus(npLang === 'en' ? '\u2713 Pull request sent' : '\u2713 Pull request sendt');
            submitBtn.textContent = npLang === 'en' ? 'Sent' : 'Sendt';
            submitBtn.style.background = '#2d7a3a';
            submitBtn.style.cursor = 'default';
            var cancelBtn = document.getElementById('np-cancel');
            if (cancelBtn) cancelBtn.textContent = npLang === 'en' ? 'Close' : 'Lukk';
            if (result && result.html_url) {
              var statusEl = document.getElementById('np-status-text');
              if (statusEl) statusEl.innerHTML = (npLang === 'en' ? '\u2713 PR: ' : '\u2713 PR: ') +
                '<a href="' + result.html_url + '" target="_blank" style="color:#fff; text-decoration:underline;">#' + result.number + '</a>';
            }
          }
        })
        .catch(function(err) {
          showMsg('error', (npLang === 'en' ? 'Error: ' : 'Feil: ') + err.message);
          submitBtn.disabled = false;
          submitBtn.style.background = '';
          submitBtn.style.cursor = '';
          submitBtn.textContent = npMode === 'child'
            ? (npLang === 'en' ? 'Create sub-chapter' : 'Opprett underkapittel')
            : (npLang === 'en' ? 'Create page' : 'Opprett side');
        });
    });
  });

  // Returnerer liste over filer som trenger vektjustering (committer ikke selv)
  function fetchSiblingWeightUpdates(token, repo, parentPath, minWeight, excludeSlug) {
    var apiBase = 'https://api.github.com/repos/SAMT-X/' + repo;
    var headers = { 'Authorization': 'token ' + token, 'Accept': 'application/vnd.github+json' };

    return fetch(apiBase + '/contents/' + parentPath, { headers: headers })
      .then(function(r) { return r.json(); })
      .then(function(entries) {
        if (!Array.isArray(entries)) return [];
        var dirs = entries.filter(function(e) { return e.type === 'dir' && e.name !== excludeSlug; });
        var fetches = [];
        dirs.forEach(function(dir) {
          ['nb', 'en'].forEach(function(lang) {
            var p = parentPath + '/' + dir.name + '/_index.' + lang + '.md';
            fetches.push(
              fetch(apiBase + '/contents/' + p, { headers: headers })
                .then(function(r) { return r.ok ? r.json() : null; })
                .then(function(data) { return data ? { path: p, data: data } : null; })
                .catch(function() { return null; })
            );
          });
        });
        return Promise.all(fetches);
      })
      .then(function(results) {
        var updates = [];
        (results || []).forEach(function(item) {
          if (!item || !item.data || !item.data.content) return;
          var content = decodeURIComponent(escape(atob(item.data.content.replace(/\n/g, ''))));
          var match = content.match(/^weight:\s*(\d+)/m);
          if (!match) return;
          var w = parseInt(match[1], 10);
          if (w < minWeight) return;
          updates.push({ path: item.path, content: content.replace(/^(weight:\s*)\d+/m, '$1' + (w + 10)) });
        });
        return updates;
      });
  }

  function yamlStr(s) {
    if (/[:#\[\]{}&*!|>'"%@`,]/.test(s) || s !== s.trim()) {
      return '"' + s.replace(/\\/g, '\\\\').replace(/"/g, '\\"') + '"';
    }
    return s;
  }

  // Oppretter flere filer i én enkelt commit via Git Data API (unngår dobbel Hugo-bygg og race condition)
  // blobItems: pre-uploadede binærfiler med SHA (valgfri, f.eks. bilder)
  function createFilesInOneCommit(token, repo, files, commitMsg, blobItems, targetBranch, org) {
    var apiBase = 'https://api.github.com/repos/' + (org || 'SAMT-X') + '/' + repo;
    var headers = {
      'Authorization': 'token ' + token,
      'Accept': 'application/vnd.github+json',
      'Content-Type': 'application/json'
    };
    var currentSha;
    var branch = targetBranch || 'main';
    return fetch(apiBase + '/git/ref/heads/main', { headers: headers, cache: 'no-store' })
      .then(function(r) { return r.json(); })
      .then(function(ref) {
        currentSha = ref.object.sha;
        if (targetBranch) {
          return fetch(apiBase + '/git/refs', { method: 'POST', headers: headers, body: JSON.stringify({ ref: 'refs/heads/' + targetBranch, sha: currentSha }) })
            .then(function(r) { if (!r.ok) return r.json().then(function(j) { throw new Error(j.message || r.statusText); }); })
            .then(function() { return fetch(apiBase + '/git/commits/' + currentSha, { headers: headers }); });
        }
        return fetch(apiBase + '/git/commits/' + currentSha, { headers: headers });
      })
      .then(function(r) { return r.json(); })
      .then(function(commit) {
        var treeItems = files.map(function(f) {
          return { path: f.path, mode: '100644', type: 'blob', content: f.content };
        }).concat(blobItems || []);
        return fetch(apiBase + '/git/trees', {
          method: 'POST', headers: headers,
          body: JSON.stringify({ base_tree: commit.tree.sha, tree: treeItems })
        });
      })
      .then(function(r) { return r.json(); })
      .then(function(tree) {
        return fetch(apiBase + '/git/commits', {
          method: 'POST', headers: headers,
          body: JSON.stringify({ message: commitMsg, tree: tree.sha, parents: [currentSha] })
        });
      })
      .then(function(r) { return r.json(); })
      .then(function(commit) {
        return fetch(apiBase + '/git/refs/heads/' + branch, {
          method: 'PATCH', headers: headers,
          body: JSON.stringify({ sha: commit.sha })
        });
      })
      .then(function(r) {
        if (!r.ok) return r.json().then(function(j) { throw new Error(j.message || r.statusText); });
        return r.json();
      });
  }

  function createFile(token, repo, path, content, message) {
    var encoded = btoa(unescape(encodeURIComponent(content)));
    return fetch('https://api.github.com/repos/SAMT-X/' + repo + '/contents/' + path, {
      method: 'PUT',
      headers: {
        'Authorization': 'token ' + token,
        'Content-Type': 'application/json',
        'Accept': 'application/vnd.github+json'
      },
      body: JSON.stringify({ message: message, content: encoded, branch: 'main' })
    }).then(function(r) {
      if (!r.ok) return r.json().then(function(j) {
        throw new Error(j.message || r.statusText);
      });
      return r.json();
    });
  }

  function setNpStatus(text) {
    var el = document.getElementById('np-status-text');
    if (el) el.textContent = text;
  }

  function showNpBuildPanel() {
    setNpStatus(npLang === 'en' ? 'Waiting for build to start…' : 'Bygging av nettstedet starter om litt…');
    var cancelBtn = document.getElementById('np-cancel');
    if (cancelBtn) cancelBtn.textContent = npLang === 'en' ? 'Close this window' : 'Lukk dette vinduet';
  }

  function showNpJobIndicator() {
    var el = document.getElementById('np-job-indicator');
    if (el) el.style.display = 'flex';
  }

  function hideNpJobIndicator() {
    var el = document.getElementById('np-job-indicator');
    if (el) el.style.display = 'none';
  }

  function navToNewPage() {
    var url = npNewPageUrl;
    url += (url.indexOf('?') >= 0 ? '&' : '?') + '_=' + Date.now();
    window.location.href = url;
  }

  function npPollBuild(startTime) {
    var lang = npLang;
    npActivePollTimer = startUrlPoll(npNewPageUrl,
      function onDone() {
        clearInterval(npActivePollTimer); npActivePollTimer = null;
        window.location.href = window.location.href.split('?')[0] + '?_=' + Date.now();
      },
      function onError(reason) {
        clearInterval(npActivePollTimer); npActivePollTimer = null;
        samtbuDecrementPending();
        setNpStatus((lang === 'en' ? '⚠ Timed out: ' : '⚠ Tidsavbrudd: ') + reason);
      },
      function onStatus(secs) { setNpStatus(lang === 'en' ? 'Updating site (' + secs + 's)…' : 'Nettsted oppdateres (' + secs + ' sek)…'); },
      startTime
    );
  }

  function showMsg(type, text) {
    var el = document.getElementById('np-msg');
    el.style.display = 'block';
    el.style.background = type === 'error' ? '#fff0f0' : '#f0fff4';
    el.style.border    = '1px solid ' + (type === 'error' ? '#f5c6c6' : '#b2dfdb');
    el.style.color     = type === 'error' ? '#900' : '#1b5e20';
    el.textContent = text;
  }

  function hideMsg() {
    document.getElementById('np-msg').style.display = 'none';
  }
})();
</script>

<!-- Slett denne siden: dialog og GitHub API -->
<script>
(function() {
  var overlay = document.getElementById('del-overlay');
  if (!overlay) return;

  var delRepo = '', delDirPath = '', delLang = 'nb', delTitle = '', delParentUrl = '', delChildCount = 0;
  var activePollTimer = null;

  window.openDeleteDialog = function(repo, dirPath, lang, title, parentUrl, childCount) {
    delRepo = repo;
    delDirPath = dirPath;
    delLang = lang || 'nb';
    delTitle = title || '';
    delParentUrl = parentUrl;
    delChildCount = childCount || 0;

    if (!getStoredToken()) {
      doGitHubLogin(function() {
        window.openDeleteDialog(repo, dirPath, lang, title, parentUrl, childCount);
      });
      return;
    }

    document.getElementById('del-heading').textContent =
      lang === 'en' ? 'Delete this page' : 'Slett denne siden';
    document.getElementById('del-confirm-text').textContent =
      lang === 'en' ? 'Delete \u201c' + title + '\u201d?' : 'Vil du slette \u00ab' + title + '\u00bb?';
    document.getElementById('del-cancel').textContent = lang === 'en' ? 'Cancel' : 'Avbryt';
    var warningEl = document.getElementById('del-children-warning');
    var footnoteEl = document.getElementById('del-footnote');
    if (delChildCount > 0) {
      var subLabel = lang === 'en'
        ? (delChildCount === 1 ? '1 sub-chapter' : delChildCount + ' sub-chapters')
        : (delChildCount === 1 ? '1 underkapittel' : delChildCount + ' underkapitler');
      warningEl.textContent = '\u26a0\ufe0f ' + (lang === 'en'
        ? 'This page has ' + subLabel + '. All sub-pages will also be deleted.'
        : 'Denne siden har ' + subLabel + '. Alle underliggende sider slettes også.');
      warningEl.style.display = 'block';
      footnoteEl.textContent = lang === 'en'
        ? 'Both language versions (nb + en) will be deleted.'
        : 'Begge språkversjoner (nb + en) slettes.';
      document.getElementById('del-confirm-btn').textContent = lang === 'en'
        ? 'Delete this page and all sub-chapters \u2192'
        : 'Slett denne siden og alle underkapitler \u2192';
    } else {
      warningEl.style.display = 'none';
      footnoteEl.textContent = lang === 'en'
        ? 'Both language versions (nb + en) will be deleted. This cannot be undone via the website \u2014 but the content can be restored from the GitHub commit history by an administrator.'
        : 'Begge språkversjoner (nb + en) slettes. Dette kan ikke angres via nettstedet \u2014 men innholdet kan gjenopprettes fra GitHub-historikken av en administrator.';
      document.getElementById('del-confirm-btn').textContent = lang === 'en' ? 'Delete page' : 'Slett siden';
    }
    document.getElementById('del-confirm-btn').disabled = false;
    document.getElementById('del-cancel').disabled = false;
    document.getElementById('del-error').style.display = 'none';
